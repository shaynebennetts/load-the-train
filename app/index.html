<!--
  Load the train — Project 1, Basic Skills for Experimentalists (TIGP 2026).
  Single self-contained file. No build step, no dependencies, no network loads.
  See SPEC.md and PLAN.md alongside this file.

  Two scripts, deliberately:
    #ltt-core  pure physics. No DOM, no rendering, no input. Runnable in node.
    #ltt-app   rendering, input and UI. Touches the DOM.
  The split is what lets Phase A of PLAN.md be verified headlessly.
-->

<script id="ltt-core">
// ===========================================================================
//  PARAMS — every constant from SPEC.md §3, with its justification.
//  Single source of truth. Frozen: nothing downstream may mutate it.
//  SI throughout: kg, m, s, N, J, W. Tonnes and km appear only in the UI.
// ===========================================================================
const PARAMS = Object.freeze({

  // --- physical constants -------------------------------------------------
  g: 9.80665,              // m/s^2, standard gravity, exact by definition

  // --- locomotive ---------------------------------------------------------
  m_loco:   150000,        // kg. Mid of the brief's 120-200 t. Six-axle Co-Co
                           //     road freight unit.
  m_driven: 150000,        // kg. All six axles driven, so the full loco mass
                           //     sits on driven axles. Cars are unpowered.
  P_rated:  1.0e6,         // W = 1 MW. Still below the brief's 2-4.5 MW band
                           //     but a realistic rating for a large yard
                           //     shunter, and disclosed (SPEC 3.2). Starting
                           //     30 m from the chute there is no line haul to
                           //     do; the whole game is low-speed shunting.
                           //     NOTE this is ABOVE the accretion-drag knee.
                           //     Full throttle with the chute open now has a
                           //       v_eq = sqrt(P/mdot) = 6.00 m/s
                           //     against a one-pass fill limit of 4.31 m/s, so
                           //     the grain no longer holds the train inside the
                           //     fillable band: the PLAYER must hold it there.
                           //     Full throttle now overruns cars. That is the
                           //     deliberate consequence of the raise; see
                           //     SPEC 3.2 and HANDOVER 3.
  mu:       0.30,          // Wheel-rail adhesion. Mid of the brief's 0.25-0.35
                           //     for dry rail with sanding. -> F_adh 441.30 kN.
  L_loco:   21.0,          // m, over couplers. Typical Co-Co.

  // --- cars ---------------------------------------------------------------
  N_cars:   20,            // Given by the brief.
  m_tare:   28000,         // kg. Mid of the brief's 25-30 t.
  m_cap:    100000,        // kg. Top of the brief's 60-100 t, so that
                           //     20 x 100 t = 2000 t matches the brief's own
                           //     timescale arithmetic.
  L_body:   15.5,          // m. Open trough length of a large covered hopper.
  L_pitch:  17.0,          // m, over couplers. Gives a 1.5 m gap, 8.82 % duty.

  // --- chute --------------------------------------------------------------
  mdot:     40 * 2500000 / 3600,
                           // kg/s = 27777.8, i.e. 100 000 t/h. FORTY TIMES the
                           //     brief's 1500-3000 t/h band, and disclosed as
                           //     such (SPEC 3.2). At a real 2500 t/h a car
                           //     takes 144 s to fill, so a 15.5 m trough can
                           //     only be filled in one pass below 0.108 m/s —
                           //     at which speed the v*dM/dt term the whole
                           //     brief is built around is 74.7 N against a
                           //     710 t train, i.e. invisible. Raising the flow
                           //     is what makes loading-on-the-move possible at
                           //     all, and with it the accretion drag becomes
                           //     the dominant force in the game.
  w_chute:  0.8,           // m aperture. Single-spout terminal chute. Narrower
                           //     than the 1.5 m gap, so a gap cannot be
                           //     straddled harmlessly.
  h_chute:  4.0,           // m above the car rim. Visual only — landing is
                           //     instantaneous (SPEC decision 5).
  x_chute:  0.0,           // m. Defines the origin of track coordinates.

  // --- grain --------------------------------------------------------------
  rho_grain: 770,          // kg/m^3, wheat. Sets the drawn fill height:
                           //     100 t -> 129.9 m^3 against a
                           //     15.5 x 3.0 x 2.8 m interior = 130.2 m^3.
  car_w:     3.0,          // m interior width   } together with L_body these
  car_d:     2.8,          // m interior depth   } give the 130.2 m^3 above

  // --- track --------------------------------------------------------------
  x_start:   -30.0,        // m. Loco nose 30 m short of the chute. The brief
                           //     said 1 km; that was a minute of holding full
                           //     power with nothing to do, so it is cut to a
                           //     short approach (SPEC 3.2). The 1 km figure is
                           //     the one departure from the brief's own text.
  x_min:     -60.0,        // m } Nose limits. Car 20 needs the nose at
  x_max:     700.0,        // m } +353.25 m, so this is ample either way.
                           //     No buffer stops, no crash state (decision 11).

  // --- time ---------------------------------------------------------------
  C_time:   1.0,           // NO TIME COMPRESSION. The clock is real: 1 s of
                           //     wall clock is 1 s for the train.
                           //     C existed only because 2000 t at a realistic
                           //     2500 t/h took 48 minutes. At 100 000 t/h the
                           //     whole load is 72 s, so the compression has
                           //     nothing left to do — and it was actively
                           //     harmful, because every timing window scales as
                           //     1/C. At C=25 a car filled in 137 ms, well
                           //     inside human reaction time. At C=1 it is 3.6 s.
                           //     See SPEC.md §3.1.
  h_step:   1 / 240,       // s of SIMULATED time. Accuracy then does not depend
                           //     on C or on display refresh rate. 4 steps per
                           //     rendered frame at 60 fps and C=1.
  max_catchup_frames: 3,   // Accumulator clamp: a stalled tab cannot spiral.

  // --- adaptive substepping (SPEC §4.1) -----------------------------------
  sub_tol:    0.01,        // Size each substep so |dv| <= sub_tol*max(|v|,vref).
  sub_vref:   0.05,        // m/s. Floor, so the criterion is finite at v -> 0.
  sub_guard:  200000,      // Loop guard on substeps per base step. Should never
                           //     be approached: the launch of Test 3 (mu -> inf
                           //     from v0 = 1e-6) is the worst case in the build
                           //     and needs 237. See SPEC 4.1.

  // --- rules (SPEC §5.6) --------------------------------------------------
  fill_target: 0.90,       // Every car must reach >= 90 % of capacity.
                           //     DEPARTS FROM THE BRIEF, which sets 95 %
                           //     ("keep every car above 95 % full"). Lowered on
                           //     Shayne's instruction and disclosed to the
                           //     player in the intro. See SPEC 3.2 and
                           //     SPEC 9 item 7. Nothing else reads a literal
                           //     0.95 — the gate, the strip threshold line and
                           //     the car-side line all derive from this.
  loss_budget: 0.01,       // Total loss must stay < 1 % of grain RELEASED
                           //     (decision 14 — the same two quantities that
                           //     Test 1's mass ledger closes on).

  // --- test tolerance (SPEC §7) -------------------------------------------
  test_tol:   0.001,       // 0.1 %, as the brief requires.
});

// --- derived constants, computed once so nothing re-derives them by hand ---
const DERIVED = Object.freeze({
  M_tare:  PARAMS.m_loco + PARAMS.N_cars * PARAMS.m_tare,        // 710 000 kg
  M_full:  PARAMS.m_loco + PARAMS.N_cars * (PARAMS.m_tare + PARAMS.m_cap),
  m_grain_total: PARAMS.N_cars * PARAMS.m_cap,                   // 2 000 000 kg
  F_adhesion: PARAMS.mu * PARAMS.m_driven * PARAMS.g,            // 441 299.2 N
  // Speed at which P/v falls to the adhesion limit. Below this, adhesion
  // governs; above it, constant power does. SPEC §2.4.
  v_cross: PARAMS.P_rated / (PARAMS.mu * PARAMS.m_driven * PARAMS.g),
  gap: PARAMS.L_pitch - PARAMS.L_body,                           // 1.5 m
  gap_duty: (PARAMS.L_pitch - PARAMS.L_body) / PARAMS.L_pitch,   // 8.82 %
  train_len: PARAMS.L_loco + PARAMS.N_cars * PARAMS.L_pitch,     // 361 m
  t_fill_car: PARAMS.m_cap / PARAMS.mdot,                        // 144 s sim
  t_fill_all: PARAMS.N_cars * PARAMS.m_cap / PARAMS.mdot,        // 2880 s sim
});

// ===========================================================================
//  physics — SPEC.md §2.3 and §4.
//
//  State is (x, p) with p = M*v, plus the per-car grain. Integrating MOMENTUM
//  rather than velocity is the whole trick: with u = 0 the variable-mass law is
//  just dp/dt = F_ext, and the v*dM/dt retarding term then EMERGES when v is
//  recovered as p/M. It is never written down anywhere below. Expanding the
//  recovery gives M*dv/dt = F_ext - v*dM/dt identically.
//
//  Knows nothing about rendering, input, or the DOM.
// ===========================================================================
const physics = (() => {

  // --- state ---------------------------------------------------------------
  // `over` may override any PARAM, which is how the tests of SPEC §7 set
  // mu: Infinity, a different P, and so on, without touching the code path.
  function create(over) {
    const par = Object.freeze(Object.assign({}, PARAMS, over || {}));
    return {
      par,
      t: 0,                                   // simulated seconds
      x: par.x_start,                         // m, position of the loco nose
      p: 0,                                   // kg m/s, = M*v
      fill: new Float64Array(par.N_cars),     // kg of grain in each car
      m_grain: 0,                             // cached sum of `fill`
      // Where spilled grain landed, in 2 m bins along the track. Drawn as
      // mounds so the player can see where they wasted it. Purely a record —
      // it never feeds back into the physics. Its total must equal the
      // ledger's m_ground (PLAN task 13).
      spill: new Float64Array(Math.ceil((par.x_max - par.x_min) / 2) + 1),
      spill_bin: 2,
      L: null,                                // ledger accumulator, if attached
      // instrumentation, not physics
      n_base: 0, n_sub: 0, max_sub_per_base: 0,
    };
  }

  // Instantaneous total moving mass: loco + car tare + grain aboard.
  // SPEC §2.3. Grain on the ground is NOT here — it was never accelerated.
  function grainAboard(st) {
    let s = 0;
    for (let i = 0; i < st.fill.length; i++) s += st.fill[i];
    return s;
  }
  // `m_grain` is kept in step with `fill` by every deposition, so mass() is O(1)
  // and is not re-summing twenty cars several times per substep.
  function mass(st) {
    return st.par.m_loco + st.par.N_cars * st.par.m_tare + st.m_grain;
  }
  function resync(st) { st.m_grain = grainAboard(st); }
  function speed(st) { return st.p / mass(st); }

  // --- forces --------------------------------------------------------------
  // Traction, SPEC §2.4:  F = throttle * min( P_rated / v , mu * m_driven * g )
  //
  // The throttle commands a FRACTION of the available tractive effort, which is
  // what a locomotive controller actually does: at low speed the notch sets
  // tractive effort against a current limit, and only at higher speed does the
  // power rating become the binding constraint. Adhesion caps the maximum
  // either way.
  //
  // This was wrong until the control-fidelity pass. The throttle used to scale
  // only the power term, so below v_cross the min() always selected the
  // adhesion cap and 1 % throttle gave exactly the same 441 kN as 100 %. All
  // low-speed control — which, starting 30 m from the chute, is the entire
  // game — was effectively a single on/off notch.
  //
  // The adhesion cap is not optional: P/v diverges as v -> 0, so without it the
  // train either launches off the line at t = 0 or produces a NaN. Setting
  // mu = Infinity (how Test 3 is run, SPEC §7.3) makes the cap unselectable and
  // leaves F = P/v exactly; the code path is unchanged, only a parameter takes
  // a limiting value. Test 3 and check S3 both run at throttle = 1, so neither
  // is affected by this correction.
  function traction(par, ctl, v) {
    const th = ctl.throttle;              // SIGNED: -1 full reverse .. +1 full forward
    if (!th) return 0;
    const adh = par.mu * par.m_driven * par.g;
    const sp = Math.abs(v);
    // Available effort is the same whether motoring or regenerating: the motors
    // are rated the same in both directions, and adhesion caps both.
    const avail = sp > 0 ? Math.min(par.P_rated / sp, adh) : adh;
    return th * avail;
  }

  // There is NO friction brake. Retardation is regenerative: the throttle is
  // pushed to the opposite sign and the traction motors work as generators.
  // Same machine, same rating, same adhesion cap, opposite direction — so it is
  // all handled by traction() above and there is nothing separate here.
  //
  // This still satisfies the brief's requirement that the brake be a FORCE and
  // be adhesion-limited rather than an unbounded constant-power brake: the
  // retarding force is min(P/|v|, mu*m_driven*g), which is capped at 441.30 kN
  // and does not diverge as v -> 0.
  //
  // The consequence the player feels: retarding effort falls off as 1/v, so a
  // loaded train takes M*v^3/(3P) to stop — 30 m from 1 m/s at 2710 t. With no
  // friction brake to fall back on, creeping is not optional.

  // --- one substep ---------------------------------------------------------
  // Classical RK4 on (x, p). M is held at its substep-entry value: within a
  // substep the mass changes by at most a few kg out of 7e5, and p is advanced
  // by the external impulse alone, which does not involve M at all. The mass
  // is then updated by the grain deposition after the mechanical step, which
  // is where the 0.5*v^2*dm of kinetic energy is actually lost.
  function rk4(st, ctl, dt) {
    const M = mass(st);
    const par = st.par;
    const f = (x, p) => {
      const v = p / M;
      const Ft = traction(par, ctl, v);
      return { dx: v, dp: Ft, v, Ft };
    };
    const k1 = f(st.x,                    st.p);
    const k2 = f(st.x + 0.5 * dt * k1.dx, st.p + 0.5 * dt * k1.dp);
    const k3 = f(st.x + 0.5 * dt * k2.dx, st.p + 0.5 * dt * k2.dp);
    const k4 = f(st.x +       dt * k3.dx, st.p +       dt * k3.dp);
    return {
      M, dt,
      dx: dt * (k1.dx + 2 * k2.dx + 2 * k3.dx + k4.dx) / 6,
      dp: dt * (k1.dp + 2 * k2.dp + 2 * k3.dp + k4.dp) / 6,
      k: [k1, k2, k3, k4],
    };
  }

  // Apply a completed substep.
  // Order matters here and is physical, not incidental. The mechanical update
  // moves momentum by the external impulse alone. THEN the grain arrives: the
  // mass rises with p unchanged, so v = p/M drops, and the kinetic energy falls
  // by exactly 0.5*v^2*dm. That is the inelastic-collision picture of SPEC §2.7
  // route 2 appearing as an operator split rather than as a formula — the
  // retarding term is still never written down anywhere.
  //
  // Geometry is evaluated at the substep midpoint, an O(dt^2) choice. The train
  // moves at most 0.083 m per substep at 20 m/s, and under 0.005 m per substep
  // at the speeds loading actually happens at, against a 0.8 m aperture.
  function commit(st, ctl, r) {
    const x_mid = st.x + 0.5 * r.dx;

    st.x += r.dx;
    st.p += r.dp;

    let dm_rel = 0, dep = { captured: 0, ground: 0 };
    if (ctl.chute) {
      dm_rel = st.par.mdot * r.dt;
      dep = geometry.deposit(st.par, st.fill, x_mid, dm_rel);
      st.m_grain += dep.captured;
      if (dep.ground > 0) {
        // Grain falls straight down, so it lands at the chute, not at the
        // train. The pile builds under the chute wherever the train is not.
        const b = Math.round((st.par.x_chute - st.par.x_min) / st.spill_bin);
        if (b >= 0 && b < st.spill.length) st.spill[b] += dep.ground;
      }
    }

    st.t += r.dt;
    st.n_sub++;

    // The ledger is handed raw samples and does its own physics and its own
    // quadrature. It is not told the answer. SPEC §6.
    if (st.L) {
      ledger.accumulate(st.L, {
        dt: r.dt, M: r.M, stages: r.k,
        dm_released: dm_rel, dm_captured: dep.captured, dm_ground: dep.ground,
      });
    }
  }

  // --- adaptive substepping (SPEC §4.1) ------------------------------------
  // March across the base step, choosing each substep so the predicted
  // velocity change stays inside sub_tol * max(|v|, sub_vref). This is what
  // keeps F = P/v tractable as v -> 0, and it is the integrator used in normal
  // play, not a path added for the tests.
  function baseStep(st, ctl, H) {
    let left = H, subs = 0;
    while (left > 1e-15 && subs < st.par.sub_guard) {
      const M = mass(st);
      const v = st.p / M;
      const par = st.par;
      const F = Math.abs(traction(par, ctl, v));
      const cap = par.sub_tol * Math.max(Math.abs(v), par.sub_vref) * M;
      // dt such that |dp| stays under `cap`; unbounded when there is no force.
      let dt = F > 0 ? cap / F : Infinity;
      if (!(dt > 1e-13)) dt = 1e-13;          // guarantee forward progress
      if (dt > left) dt = left;
      // No stop-at-zero special case: regenerative effort is continuous through
      // v = 0 (the adhesion branch takes over as P/|v| diverges), and holding
      // reverse throttle through zero correctly drives the train backwards.
      commit(st, ctl, rk4(st, ctl, dt));
      left -= dt;
      subs++;
    }
    st.n_base++;
    if (subs > st.max_sub_per_base) st.max_sub_per_base = subs;
  }

  // Advance exactly `dt` of SIMULATED time, in base steps of h_step.
  // Driven by an integer step count, and st.t is recomputed from that count at
  // every base boundary rather than accumulated, so 14400 steps of 1/240 s land
  // on exactly 60 s with no drift and no stray final step.
  function advance(st, ctl, dt) {
    if (!(dt > 0)) return;
    const h = st.par.h_step, t0 = st.t;
    const n = Math.floor(dt / h + 1e-9);
    for (let i = 0; i < n; i++) {
      baseStep(st, ctl, h);
      st.t = t0 + (i + 1) * h;
    }
    const rem = dt - n * h;
    if (rem > 1e-15) baseStep(st, ctl, rem);
    st.t = t0 + dt;
  }

  return { create, mass, speed, grainAboard, resync, advance, baseStep, rk4 };
})();

// ===========================================================================
//  geometry — SPEC.md §2.9. Where the grain loss comes from.
//
//  There is NO loss coefficient in this build. Loss falls out of the overlap
//  of the chute aperture with the open troughs, and nothing else. A fitted
//  penalty would still feel like a game and would fail every measurement made
//  of it.
//
//  Track coordinates: the chute is at x_chute, +x is forward, and `x` is the
//  position of the LOCO NOSE. The loco leads (SPEC decision 11), so the train
//  trails behind the nose:
//
//      loco body      [x - L_loco, x]                       captures nothing
//      car k trough   [F_k - L_body, F_k]     k = 0 .. N-1
//      F_k = x - L_loco - gap - k*L_pitch     gap = L_pitch - L_body = 1.5 m
//
//  so the rear of car N-1 sits at x - 361 m and the train is 361 m long.
// ===========================================================================
const geometry = (() => {

  const gapOf = par => par.L_pitch - par.L_body;

  // Front edge of the open trough of car k (0-based).
  function troughFront(par, x, k) {
    return x - par.L_loco - gapOf(par) - k * par.L_pitch;
  }

  // Length of aperture that lies over car k's trough, in metres.
  function overlap(par, x, k) {
    const F = troughFront(par, x, k), R = F - par.L_body;
    const a = par.x_chute - par.w_chute / 2, b = par.x_chute + par.w_chute / 2;
    const o = Math.min(b, F) - Math.max(a, R);
    return o > 0 ? o : 0;
  }

  // Which cars could possibly be under the aperture. O(1) — solved, not
  // searched, so the per-step cost does not grow with the number of cars.
  // The aperture (0.8 m) is far narrower than the pitch (17 m), so this is at
  // most two cars.
  function range(par, x) {
    const a = par.x_chute - par.w_chute / 2, b = par.x_chute + par.w_chute / 2;
    const base = x - par.L_loco - gapOf(par);
    let lo = Math.ceil((base - par.L_body - b) / par.L_pitch);
    let hi = Math.floor((base - a) / par.L_pitch);
    if (lo < 0) lo = 0;
    if (hi > par.N_cars - 1) hi = par.N_cars - 1;
    return [lo, hi];
  }

  // Fraction of released grain that lands in SOME trough, ignoring capacity.
  // Purely geometric. Integrated over one full pitch this equals L_body/L_pitch.
  function captureFraction(par, x) {
    const [lo, hi] = range(par, x);
    let o = 0;
    for (let k = lo; k <= hi; k++) o += overlap(par, x, k);
    return o / par.w_chute;
  }

  // Deposit `dm` kg of released grain. Returns what was captured and what hit
  // the ground. Grain is lost to: coupling gaps, the locomotive roof, the space
  // ahead of car 0, the space beyond the last car, and overflow of a full car.
  function deposit(par, fill, x, dm) {
    if (!(dm > 0)) return { captured: 0, ground: 0 };
    const [lo, hi] = range(par, x);
    let captured = 0;
    for (let k = lo; k <= hi; k++) {
      const o = overlap(par, x, k);
      if (o <= 0) continue;
      const want = dm * o / par.w_chute;
      const room = par.m_cap - fill[k];
      const take = want < room ? want : (room > 0 ? room : 0);
      fill[k] += take;
      captured += take;
    }
    return { captured, ground: dm - captured };
  }

  // What is under the chute, for the HUD caption (SPEC §5.1). Reported from the
  // aperture centre.
  function underChute(par, x) {
    const c = par.x_chute;
    if (c > x) return { kind: 'ahead' };
    if (c >= x - par.L_loco) return { kind: 'loco' };
    if (c < x - par.L_loco - gapOf(par) - par.N_cars * par.L_pitch + gapOf(par)) {
      return { kind: 'past' };
    }
    const k = Math.floor((x - par.L_loco - gapOf(par) - c) / par.L_pitch);
    const kk = Math.min(Math.max(k, 0), par.N_cars - 1);
    const F = troughFront(par, x, kk);
    if (c <= F && c >= F - par.L_body) return { kind: 'car', index: kk };
    return { kind: 'gap', index: kk };     // gap behind car kk
  }

  return { troughFront, overlap, range, captureFraction, deposit, underChute, gapOf };
})();

// ===========================================================================
//  ledger — SPEC.md §2.8. The accounting, kept deliberately separate from the
//  integrator.
//
//  The brief's explicit safeguard against the factor-of-two error is that the
//  reasoning which writes the integrator must not also write the ledger. So
//  this module is handed raw per-substep samples — dt, M, the RK4 stage
//  velocities and forces, and the grain released / captured / spilled — and
//  derives every quantity from SPEC §2.7 route 2, the inelastic-collision
//  argument, on its own. It never reads the integrator's algebra, and the
//  identity of Test 2 is CHECKED here, never assumed.
// ===========================================================================
const ledger = (() => {

  function create(st, ke0) {
    return {
      // mass, kg
      m_released: 0,        // flow rate x open time
      m_captured: 0,        // accumulated here, independently of where the
                            //   cars store it — so the two can disagree
      m_ground: 0,
      m_cars_0: st ? st.m_grain : 0,   // grain already aboard when we started
      worst_step_mass_residual: 0,
      // energy, J
      KE_0: ke0 || 0,       // total kinetic energy when the ledger was armed
      W_traction: 0,        // + integral F_traction . v dt
      W_regen: 0,           // + integral |F_brake . v| dt, energy REMOVED
      E_diss: 0,            // + integral 0.5 v^2 (dM/dt) dt
      J_acc: 0,             // + integral v (dM/dt) dt, N s — Test 4 cross-check
      n: 0,
    };
  }

  function accumulate(L, s) {
    L.n++;

    // --- mass -------------------------------------------------------------
    // Per substep the released grain either lands in a trough or hits the
    // ground; there is no third place for it to be, because landing is
    // instantaneous (SPEC decision 5). So the identity holds at EVERY step,
    // not merely over a run, and the worst per-step residual is recorded.
    const r = s.dm_released - (s.dm_captured + s.dm_ground);
    const ar = r < 0 ? -r : r;
    if (ar > L.worst_step_mass_residual) L.worst_step_mass_residual = ar;

    L.m_released += s.dm_released;
    L.m_captured += s.dm_captured;
    L.m_ground   += s.dm_ground;

    // --- energy -----------------------------------------------------------
    // Quadrature: Simpson across the substep, using the four RK4 stage samples.
    // k[0] sits at tau = 0, k[1] and k[2] at tau = dt/2, k[3] at tau = dt, so
    // with mid = (k1+k2)/2 Simpson's (a + 4 mid + b)/6 becomes
    // (a + 2 k1 + 2 k2 + b)/6. Choosing a quadrature rule is a numerical
    // decision; the PHYSICS below comes from SPEC §2.7 route 2 alone.
    const k = s.stages, dt = s.dt;
    const simp = (a, m1, m2, b) => dt * (a + 2 * m1 + 2 * m2 + b) / 6;

    // With one bipolar control there is a single signed mechanical work
    // integral, and it is split by SIGN for reporting: where F.v > 0 the motors
    // are driving, where F.v < 0 they are generating and returning energy.
    //
    // The split is exact, not approximate. max(a,0) + min(a,0) = a identically,
    // and Simpson's rule is linear, so W_traction - W_regen is exactly the
    // Simpson integral of F.v. The brief's Test 2 form is therefore preserved
    // verbatim, with W_regen playing the role of its W_brakes.
    const pos = x => x > 0 ? x : 0, neg = x => x < 0 ? x : 0;
    const fv0 = k[0].Ft * k[0].v, fv1 = k[1].Ft * k[1].v,
          fv2 = k[2].Ft * k[2].v, fv3 = k[3].Ft * k[3].v;
    L.W_traction += simp(pos(fv0), pos(fv1), pos(fv2), pos(fv3));
    L.W_regen    -= simp(neg(fv0), neg(fv1), neg(fv2), neg(fv3));

    // Dissipation. Derived in SPEC §2.7 ROUTE 2, the perfectly inelastic
    // collision, and written from that argument alone:
    //
    //   a parcel dm at rest merging with mass M moving at v gives
    //     v' = Mv/(M+dm)
    //     KE after = 0.5 M^2 v^2/(M+dm) = 0.5 M v^2 - 0.5 v^2 dm + O(dm^2)
    //   so exactly 0.5 * v^2 * dm of kinetic energy is destroyed.
    //
    // THE HALF IS THE WHOLE POINT. The train gives up v^2 dm; half of that
    // becomes kinetic energy of the grain (which is already inside 0.5 M v^2,
    // because M includes loaded grain) and half is destroyed here. Grain that
    // misses a car is never accelerated, so dm_captured — not dm_released — is
    // what appears.
    if (s.dm_captured > 0) {
      // The RK4 stages carry momentum to the substep midpoint but hold M at the
      // substep entry, so k[1].v and k[2].v are half a mass-step stale. Taking
      // v at the MASS midpoint, M + dm/2, costs one divide and moves this
      // integral from first order in dm/M to second:
      //   exact per step   0.5 p^2 dm / (M_n * M_n+1)
      //   entry-mass v     0.5 p^2 dm / M_n^2          high by (1 + dm/M)
      //   midpoint-mass v  0.5 p^2 dm / (M_n + dm/2)^2 off by (dm/2M)^2
      // Measured on Test 4a: 4.1e-6 -> 4.2e-12.
      const v_mid = 0.5 * (k[1].v + k[2].v) * s.M / (s.M + 0.5 * s.dm_captured);
      L.E_diss += 0.5 * v_mid * v_mid * s.dm_captured;
      L.J_acc  += v_mid * s.dm_captured;
    }
  }

  // Test 1 (SPEC §7.1):  m_released == m_cars + m_ground
  // Test 2 (SPEC §7.2):  W_traction - W_regen == dKE_total + E_diss
  //
  // `kin` carries the CURRENT total kinetic energy. Both identities are checked
  // here, never assumed.
  function report(L, st, kin) {
    const m_cars = st.m_grain - L.m_cars_0;
    const rhs_m = m_cars + L.m_ground;
    const resid_m = L.m_released - rhs_m;
    const rel_m = L.m_released > 0 ? Math.abs(resid_m) / L.m_released : 0;
    // Second route: the ledger's own captured total against the cars' own state.
    const split = Math.abs(L.m_captured - m_cars);

    const KE = kin === undefined ? 0 : kin;
    const dKE = KE - L.KE_0;
    const lhs_e = L.W_traction - L.W_regen;   // = the signed integral of F.v
    const rhs_e = dKE + L.E_diss;
    const resid_e = lhs_e - rhs_e;
    // Normalise by the largest term present, so the measure stays meaningful
    // when traction and brake are both zero (Test 4's coasting case, where the
    // left side is exactly zero and dKE balances E_diss on the right).
    const scale = Math.max(Math.abs(L.W_traction), Math.abs(L.W_regen),
                           Math.abs(dKE), Math.abs(L.E_diss));

    return {
      // --- Test 1 ---
      m_released: L.m_released,
      m_cars, m_ground: L.m_ground,
      m_captured_by_ledger: L.m_captured,
      mass_residual: resid_m,
      mass_closure: rel_m,
      mass_per_car_split_residual: split,
      worst_step_mass_residual: L.worst_step_mass_residual,
      loss_fraction: L.m_released > 0 ? L.m_ground / L.m_released : 0,
      // --- Test 2 ---
      W_traction: L.W_traction,
      W_regen: L.W_regen,
      KE_0: L.KE_0, KE: KE, dKE,
      E_diss: L.E_diss,
      energy_lhs: lhs_e, energy_rhs: rhs_e,
      energy_residual: resid_e,
      energy_closure: scale > 0 ? Math.abs(resid_e) / scale : 0,
      energy_closure_vs_traction: Math.abs(L.W_traction) > 0
        ? Math.abs(resid_e) / Math.abs(L.W_traction) : null,
      // --- Test 4 cross-check ---
      J_acc: L.J_acc,
      substeps: L.n,
    };
  }

  return { create, accumulate, report };
})();

// ===========================================================================
//  rules — SPEC.md §5.6. The two gates, and nothing else.
//
//  Both thresholds stay thresholds: a run passes or it does not. There is no
//  composite score and no partial credit. Passing runs are ranked by elapsed
//  time alone, which is a measured quantity rather than an invented one.
// ===========================================================================
const rules = (() => {

  // Gate 1: every car at or above fill_target (90 %) of capacity.
  // Gate 2: grain on the ground below 1 % of grain RELEASED — the same two
  //         quantities Test 1's mass ledger closes on (SPEC decision 14).
  function verdict(st, L) {
    const p = st.par;
    const under = [];
    let minFrac = Infinity, minCar = 1;
    for (let i = 0; i < st.fill.length; i++) {
      const f = st.fill[i] / p.m_cap;
      if (f < minFrac) { minFrac = f; minCar = i + 1; }
      if (f < p.fill_target) under.push(i + 1);
    }
    const loss = L.m_released > 0 ? L.m_ground / L.m_released : 0;
    const fillPass = under.length === 0;
    const lossPass = loss < p.loss_budget;
    return {
      minFrac, minCar, under, fillPass,
      loss, lossPass,
      pass: fillPass && lossPass,
      m_released: L.m_released, m_cars: L.m_cars, m_ground: L.m_ground,
    };
  }

  // Calibrated 2026-09-12 (PLAN task 22), against a measured floor rather than
  // invented. An ideal driver -- exact speed hold, perfect chute timing -- needs
  // 90.8 s: at a held 4.50 m/s every car lands at 90.7 % with 0.000 % loss. At
  // 4.60 m/s the run is 89.0 s but every car falls under the 90 % gate, so ~91 s
  // is a hard physics floor, not a skill ceiling.
  //
  //   A < 105 s   within ~15 % of the floor
  //   B < 125 s
  //   C < 150 s
  //   D otherwise
  //
  // The previous bands (A < 150) were invented and far too loose: they awarded
  // the top grade to a 131 s run that the player himself described as "OK".
  // Numbers and method in docs/MEASUREMENTS.md.
  const BANDS = [[105, 'A'], [125, 'B'], [150, 'C']];
  function grade(tWall) {
    for (const [lim, g] of BANDS) if (tWall < lim) return g;
    return 'D';
  }

  // Distance needed to stop from speed v at full regenerative effort. Used for
  // the trip stop that keeps the train on the track without inventing a crash
  // state: the brake is applied through the normal control path, so the energy
  // it removes lands in W_regen like any other retardation and the ledger still
  // closes.
  //
  // PIECEWISE, and it has to be. Retardation is traction() with a negative
  // argument, so it is capped by ADHESION below v_c and by POWER above it:
  //
  //   v <= v_c   constant force F_a       s = M v^2 / (2 F_a)
  //   v >  v_c   constant power to v_c,   s = M (v^3 - v_c^3) / (3 P)
  //              then adhesion to rest      + M v_c^2 / (2 F_a)
  //
  // This was wrong until 2026-09-12: it used the constant-power form
  // M|v|^3/(3P) at every speed, with a comment claiming that adhesion gives
  // MORE force than P/|v| below v_c so the estimate was conservative. It is the
  // other way round -- min() selects the adhesion cap there, which is LESS
  // force, so the train takes LONGER to stop and the old form UNDER-estimated.
  // The error is bounded by M v_c^2 / (6 F_a) = 5.26 m loaded, 1.38 m tare, and
  // the call site adds a flat 6 m margin, so the trip stop never actually
  // failed -- but it was safe by luck, and the raise to 1 MW had doubled the
  // error. Measured against the integrator, the piecewise form agrees to 0.01 m
  // at 1, 2, 4 and 6 m/s at both tare and loaded mass.
  //
  // Strongly mass dependent, unlike the friction brake it replaced:
  // 3.07 m from 1 m/s at 2710 t, against 0.80 m at 710 t.
  function stopDistance(par, v, M) {
    const F_a = par.mu * par.m_driven * par.g;
    const v_c = par.P_rated / F_a;
    const a = Math.abs(v);
    const tail = M * v_c * v_c / (2 * F_a);          // v_c -> 0, adhesion-limited
    return a <= v_c ? M * a * a / (2 * F_a)
                    : M * (a ** 3 - v_c ** 3) / (3 * par.P_rated) + tail;
  }

  return { verdict, grade, stopDistance, BANDS };
})();

// ===========================================================================
//  tests — SPEC.md §7. The brief's four acceptance tests, plus supplementary
//  check S3 and a determinism check.
//
//  Every predicted value here is a CLOSED FORM derived in SPEC.md, evaluated
//  from PARAMS. Nothing is a number copied from an observed output, no test is
//  weakened to pass, and no exception is swallowed. A failure is reported as a
//  failure.
// ===========================================================================
const tests = (() => {

  const gapOf = p => p.L_pitch - p.L_body;
  // Nose position putting the chute `d` behind car k's front edge.
  const noseFor = (p, k, d) => p.x_chute + d + p.L_loco + gapOf(p) + k * p.L_pitch;

  // ---- the scripted sequence used by Tests 1 and 2 ------------------------
  // Drives every loss channel: chute ahead of the train, onto the locomotive
  // roof, across coupling gaps, into an already-full car, and past the last
  // car. Throttle and brake both exercised, and grain loaded while moving,
  // which is what puts v*dM/dt into the energy ledger.
  //
  // Segment 3 exists so that "spilled grain enters neither energy term" is
  // actually tested. Spilling at v = 0 cannot detect a ledger that charges
  // dissipation on released rather than captured grain, because 0.5*v^2*dm
  // vanishes either way. Segment 3 spills 19 t at ~12.8 m/s, where that error
  // is worth 1.6 MJ against a true net work of 0.64 MJ.
  //
  // x is set at two boundaries to place the train precisely — legitimate, and
  // it cannot perturb the energy ledger because the track is level, so
  // position carries no potential energy. Velocity is NEVER discontinuously
  // changed mid-sequence; that would inject kinetic energy from nowhere.
  // Velocity is set ONCE, in segment 1, before the ledger is armed. Every later
  // segment changes only x and the controls. An earlier version set v: 0 at two
  // boundaries; with the shipped P the train happened to be stopped there so it
  // was a no-op, but at P = 4.5 MW it was not, and destroying kinetic energy
  // outside the ledger broke Test 2 — which caught it. Braking segments are
  // long enough to reach rest for any power the parameters can plausibly take,
  // rather than assuming it.
  function sequence(p) {
    return [
      { label: 'stationary, chute open 900 m short — ahead-of-train loss at rest',
        x: -900, v: 0, throttle: 0, chute: true, t: 20 },
      { label: 'accelerate, chute shut',
        throttle: 1, chute: false, t: 25 },
      { label: 'coast at speed, chute open, still short — HEAVY SPILL AT SPEED',
        throttle: 0, chute: true, t: 28 },
      { label: 'regenerate to rest, chute shut',
        throttle: -1, chute: false, t: 30 },
      { label: 'chute over the locomotive — loco roof loss',
        x: p.x_chute + p.L_loco / 2, throttle: 0, chute: true, t: 10 },
      { label: 'chute on car 1 centre — fills to capacity then overflows',
        x: noseFor(p, 0, p.L_body / 2), throttle: 0, chute: true, t: 160 },
      { label: 'crawl forward, chute open — coupling-gap loss + accretion drag',
        throttle: 0.15, chute: true, t: 60 },
      { label: 'regenerate while still loading — recovery with accretion',
        throttle: -1, chute: true, t: 30 },
      { label: 'chute open past the last car — past-the-train loss',
        x: p.x_chute + p.L_loco + p.N_cars * p.L_pitch + 140,
        throttle: 0, chute: true, t: 30 },
      { label: 'accelerate, chute shut — work integrals, no accretion',
        throttle: 1, chute: false, t: 20 },
      { label: 'regenerate to rest, chute shut',
        throttle: -1, chute: false, t: 30 },
    ];
  }

  // ---- result helpers ----------------------------------------------------
  // Overrides that make the total train mass exactly M, for the hand-checkable
  // tests. Stuffing grain into car 1 cannot reach an M below the bare train
  // mass of 710 t — and SPEC §7.5's own example asks for 500 t — so the mass is
  // pinned by overriding the tare figures instead. Test 3 runs with the chute
  // shut and at mu -> Infinity, so neither the cars nor m_driven play any part
  // in it; M is simply the inertia being accelerated.
  function massOverride(p, M) {
    const tareTotal = p.N_cars * p.m_tare;
    if (!(M > 0)) throw new Error('M must be positive, got ' + M);
    if (M > tareTotal) return { m_loco: M - tareTotal };
    return { m_loco: M, m_tare: 0 };
  }

  // `scale` is required for any row whose expected value is exactly zero.
  //
  // A cancellation check like "dKE + E_diss must be 0" has nothing to divide by,
  // and the original code fell back to the raw absolute difference — comparing
  // a quantity in joules against a dimensionless 0.1 % tolerance. That is not a
  // test of anything: it passes or fails purely on the units and magnitude of
  // the run. Raising the chute flow 40x multiplied E_diss by 40, the absolute
  // residual grew with it, and Test 4b failed at a reported 2.47e-3 while the
  // true relative error was 4.1e-9. Such rows now supply the magnitude of the
  // terms being cancelled and are judged against that.
  function row(label, got, pred, unit, tol, scale) {
    let relerr = null, pass = true;
    if (pred !== null && pred !== undefined) {
      const d = Math.abs(got - pred);
      const den = Math.abs(pred) > 0 ? Math.abs(pred) : Math.abs(scale || 0);
      if (Math.abs(pred) === 0 && !(den > 0)) {
        throw new Error('row("' + label + '"): expected value is 0 and no scale ' +
                        'was given, so no relative error can be formed');
      }
      relerr = d / den;
      pass = relerr <= (tol === undefined ? PARAMS.test_tol : tol);
    }
    return { label, got, pred, unit: unit || '', relerr, pass };
  }
  function info(label, got, unit) { return row(label, got, null, unit); }
  function result(id, title, rows, notes) {
    return { id, title, tol: PARAMS.test_tol, rows,
             notes: notes || [], pass: rows.every(r => r.pass) };
  }

  // =========================== TEST 1 ===================================
  function test1(opts) {
    LTT.reset(opts);
    const L = LTT.runScript(sequence(LTT.effective()));
    const st = LTT.state();
    return result('1', 'Mass ledger — released = in cars + on ground', [
      info('grain released by the chute', L.m_released, 'kg'),
      info('grain in cars',               L.m_cars,     'kg'),
      info('grain on the ground',         L.m_ground,   'kg'),
      row('cars + ground  vs  released', L.m_cars + L.m_ground, L.m_released, 'kg'),
      row('worst SINGLE-STEP residual',  L.worst_step_mass_residual, 0, 'kg', 1e-9,
          PARAMS.mdot * PARAMS.h_step),
      row('ledger total vs per-car sum', L.m_captured_by_ledger, L.m_cars, 'kg', 1e-9),
      info('loss as a fraction of released', L.loss_fraction, ''),
      info('substeps taken',              L.substeps, ''),
    ], [
      'Landing is instantaneous, so there is no in-flight bucket and the',
      'identity holds at EVERY substep, not merely over the run — stronger',
      'than the brief requires. The worst per-step residual is row 5.',
      'Row 6 is a second route: the ledger accumulates captured mass',
      'independently of where the cars store it, so a disagreement between',
      'deposit()’s returned total and its per-car bookkeeping would show.',
      'Cars holding grain at the end: ' +
        st.fill.map((f, i) => f > 1 ? (i + 1) : null).filter(Boolean).join(', '),
    ]);
  }

  // =========================== TEST 2 ===================================
  function test2(opts) {
    LTT.reset(opts);
    const L = LTT.runScript(sequence(LTT.effective()));
    return result('2', 'Energy ledger — W_tr − W_br = ΔKE + ½∫v²dM', [
      info('W_traction',                 L.W_traction, 'J'),
      info('W_regen (recovered)',        L.W_regen,    'J'),
      info('left side   W_tr − W_br',    L.energy_lhs, 'J'),
      info('ΔKE_total  (full instantaneous M)', L.dKE, 'J'),
      info('E_diss = ½∫v²(dM/dt)dt',     L.E_diss,     'J'),
      row('right side  ΔKE + E_diss  vs  left side', L.energy_rhs, L.energy_lhs, 'J'),
      info('residual',                   L.energy_residual, 'J'),
      info('closure as a fraction of W_traction', L.energy_closure_vs_traction, ''),
      row('mass closure on the same run', L.mass_closure, 0, '', PARAMS.test_tol, 1),
      info('grain spilled (in neither energy term)', L.m_ground, 'kg'),
    ], [
      'ΔKE_total uses the full instantaneous mass including loaded grain.',
      'Spilled grain enters neither side, which is the brief’s cross-check',
      'against Test 1 — the mass closure on this same run is row 9.',
      'E_diss is coded from SPEC §2.7 route 2, the inelastic-collision',
      'argument, independently of the integrator. The factor of one half is',
      'the single most likely error in this build; if it were wrong, row 6',
      'would be out by a factor of two, not by 1e-7.',
    ]);
  }

  // =========================== TEST 3 ===================================
  // Constant power from rest. Run with mu -> Infinity so the adhesion branch of
  // the min() is unselectable and F = P/v holds exactly (SPEC decision 13).
  function test3(opts) {
    const o = Object.assign({ t: 60, v0: 1e-6 }, opts || {});
    let over = Object.assign({}, o, { mu: Infinity });
    if ('M' in o) over = Object.assign(over, massOverride(PARAMS, o.M));
    LTT.reset(over);
    const p = LTT.effective();
    const M = p.m_loco + p.N_cars * p.m_tare;
    const P_ = p.P_rated, t = o.t, v0 = o.v0;

    LTT.setState({ throttle: 1, chute: false, v: v0 });
    LTT.arm();
    const x0 = LTT.state().x;
    LTT.step(t);
    const s = LTT.state();

    // Exact constant-power solution with a non-zero start. As v0 -> 0 these
    // become the brief's v = sqrt(2Pt/M) and s = (2/3)sqrt(2P/M) t^(3/2).
    const vPred = Math.sqrt(v0 * v0 + 2 * P_ * t / M);
    const sPred = (M / (3 * P_)) * (Math.pow(v0 * v0 + 2 * P_ * t / M, 1.5) - v0 * v0 * v0);
    const vBrief = Math.sqrt(2 * P_ * t / M);
    const sBrief = (2 / 3) * Math.sqrt(2 * P_ / M) * Math.pow(t, 1.5);

    // What the SHIPPED mu would have done, for the record.
    const Fa = p.mu * p.m_driven * p.g, a = Fa / M, vc = P_ / Fa, tc = vc / a;

    return result('3', 'Constant power from rest, μ → ∞', [
      info('M',  M,  'kg'),
      info('P',  P_, 'W'),
      info('t',  t,  's sim'),
      row('v(t)', s.v,      vPred, 'm/s'),
      row('s(t)', s.x - x0, sPred, 'm'),
      info('max substeps in one base step', s.max_sub_per_base, ''),
      info('substeps total', s.n_sub, ''),
    ], [
      'Run at mu = Infinity, so min(P/v, mu·m_d·g) can only ever select P/v.',
      'The code path is unchanged; only a parameter takes a limiting value.',
      'Started from v0 = ' + v0 + ' m/s, not exactly rest, because P/0 is',
      'infinite. The prediction above is the exact solution for that initial',
      'condition; the brief’s v0 = 0 forms give v = ' + vBrief.toPrecision(10) +
        ' and s = ' + sBrief.toPrecision(10) + ',',
      'differing by ' + (Math.abs(vBrief - vPred) / vPred).toExponential(1) +
        ' and ' + (Math.abs(sBrief - sPred) / sPred).toExponential(1) +
        ' — fifteen orders below tolerance.',
      '',
      'Why μ → ∞ is necessary. With the shipped mu = ' + p.mu + ' the adhesion',
      'limit binds below v_c = ' + vc.toFixed(6) + ' m/s, reached at t_c = ' +
        tc.toFixed(6) + ' s,',
      'and the exact solution after crossover is offset by exactly t_c/2 — a',
      'constant force from rest delivers precisely half the energy constant',
      'power would. So the naive formula is high by ' +
        (100 * (vBrief / Math.sqrt(vc * vc + 2 * P_ * (t - tc) / M) - 1)).toFixed(2) +
        ' % in v at this t,',
      'and the deviation decays only as t_c/2t. It never reaches 0.1 % on any',
      'playable timescale. Supplementary check S3 covers the adhesion limit.',
      'Max substeps in one base step must stay well under sub_guard = ' +
        p.sub_guard + '; a hit there would mean the launch was truncated.',
    ]);
  }

  // =========================== TEST 4 ===================================
  // Coasting accretion. Mv is constant, so everything follows from M_final
  // alone and no integration is needed — which is the point of the test.
  function test4(opts) {
    const o = Object.assign({}, opts || {});
    const p0 = PARAMS;
    const variants = [
      // Chute kept inside car 1's trough throughout, so capture is 100 % and
      // M_final is predictable in closed form. Car 1 spans [x-38, x-22.5] and
      // the 0.8 m aperture is fully inside for 22.9 <= x <= 37.6; moving
      // forward carries the chute from the trough's front edge to its rear.
      { tag: 'a', v0: 0.1, t: 140, full: true },
      // Sweeping many cars, with real coupling-gap losses, M_final measured.
      { tag: 'b', v0: 2.0, t: 60,  full: false },
    ];
    const rows = [], notes = [];
    for (const V of variants) {
      const v0 = ('v0' in o && V.tag === 'a') ? o.v0 : V.v0;
      LTT.reset(o);
      const p = LTT.effective();
      let t = ('t' in o && V.tag === 'a') ? o.t : V.t;

      if (V.full) {
        // Variant a's premise is 100 % capture, which needs two things the
        // caller may have overridden out from under it. Derive the open time
        // rather than hard-coding it against the shipped parameters.
        const M0 = p.m_loco + p.N_cars * p.m_tare;
        // (i) the car must not fill: leave 2 % of capacity spare.
        const tCap = 0.98 * p.m_cap / p.mdot;
        // (ii) the chute must not run off the back of the trough. Coasting with
        //      accretion, distance = (M0 v0/mdot) ln(1 + mdot t/M0), so
        //      inverting for the usable trough length gives:
        const D = p.L_body - p.w_chute - 0.2;
        const tRun = (M0 / p.mdot) * (Math.exp(D * p.mdot / (M0 * v0)) - 1);
        t = Math.min(t, tCap, tRun);
      }
      // Start with the aperture just inside car 1's FRONT edge. Moving forward
      // carries the trough forward past the fixed chute, so the chute tracks
      // from the front edge toward the rear — 14.7 m of usable travel. Starting
      // at the rear edge instead leaves only 0.9 m and the grain falls out the
      // back, which is exactly what the first version of this test did.
      LTT.setState({ x: noseFor(p, 0, 0.5 * p.w_chute),
                     v: v0, throttle: 0, chute: true });
      LTT.arm();
      const M0 = LTT.state().M, pmom = LTT.state().p, KE0 = 0.5 * M0 * v0 * v0;
      LTT.step(t);
      const s = LTT.state(), L = LTT.ledger();
      const Mf = s.M, vf = s.v, KEf = 0.5 * Mf * vf * vf;

      const vfP  = v0 * M0 / Mf;
      const ratP = M0 / Mf;
      const JP   = pmom * Math.log(Mf / M0);
      const dsP  = 0.5 * pmom * pmom * (1 / M0 - 1 / Mf);

      rows.push(info('— variant ' + V.tag + ':  v0 = ' + v0 + ' m/s, ' +
                     (Math.round(t * 1e4) / 1e4) + ' s open', NaN, ''));
      if (V.full) {
        rows.push(row('  M_final (100 % capture expected)', Mf, M0 + p.mdot * t, 'kg', 1e-12));
        rows.push(row('  grain spilled', L.m_ground, 0, 'kg', 1e-9, L.m_cars));
      } else {
        rows.push(info('  M_final (measured)', Mf, 'kg'));
        rows.push(info('  grain spilled across gaps', L.m_ground, 'kg'));
      }
      rows.push(row('  v_final = v0·M0/M_final', vf, vfP, 'm/s'));
      rows.push(row('  KE_final/KE_0 = M0/M_final', KEf / KE0, ratP, ''));
      rows.push(row('  p = Mv (must be constant)', Mf * vf, pmom, 'kg m/s'));
      rows.push(row('  ΔKE', L.dKE, -dsP, 'J'));
      rows.push(row('  E_diss', L.E_diss, dsP, 'J'));
      rows.push(row('  J_acc = p·ln(M_f/M_0)', L.J_acc, JP, 'N s'));
      // Normalised against the magnitude of the two terms that must cancel.
      rows.push(row('  cross-check ΔKE + E_diss', L.dKE + L.E_diss, 0, 'J',
                     undefined, dsP));
    }
    notes.push('Mv is constant while coasting, so v_final and the KE ratio follow');
    notes.push('from M_final with no integration at all. The momentum-form');
    notes.push('integrator advances p by a zero impulse here, so these pass to');
    notes.push('machine precision — that is the point, not a fudge. Two');
    notes.push('independent cross-checks keep the test honest: J_acc against');
    notes.push('p·ln(M_f/M_0), accumulated by the ledger and not by the');
    notes.push('integrator; and ΔKE + E_diss = 0, which is Test 2 with F_ext = 0,');
    notes.push('so a factor-of-two error would surface here as a factor of two.');
    notes.push('Variant b spills real grain across coupling gaps, confirming the');
    notes.push('accretion term does not care how the grain was distributed.');
    return result('4', 'Coasting accretion — Mv constant', rows, notes);
  }

  // ====================== SUPPLEMENTARY CHECK S3 ========================
  // Beyond the brief's four tests, and easy to strike (SPEC open point 2).
  // Test 3 runs at mu -> Infinity, so nothing in it exercises the adhesion cap
  // that governs every launch and every shunt in normal play. This does.
  function checkS3(opts) {
    const o = Object.assign({ t: 60 }, opts || {});
    let over = Object.assign({}, o);
    if ('M' in o) over = Object.assign(over, massOverride(PARAMS, o.M));
    LTT.reset(over);
    const p = LTT.effective();
    const M = p.m_loco + p.N_cars * p.m_tare;
    const Fa = p.mu * p.m_driven * p.g;
    const a = Fa / M, vc = p.P_rated / Fa, tc = vc / a, sc = 0.5 * a * tc * tc;

    LTT.setState({ throttle: 1, chute: false, v: 0 });
    LTT.arm();
    const x0 = LTT.state().x;
    LTT.step(o.t);
    const s = LTT.state();

    let vP, sP;
    if (o.t <= tc) { vP = a * o.t; sP = 0.5 * a * o.t * o.t; }
    else {
      vP = Math.sqrt(vc * vc + 2 * p.P_rated * (o.t - tc) / M);
      sP = sc + (M / (3 * p.P_rated)) * (vP ** 3 - vc ** 3);
    }
    const vN = Math.sqrt(2 * p.P_rated * o.t / M);
    const sN = (2 / 3) * Math.sqrt(2 * p.P_rated / M) * Math.pow(o.t, 1.5);

    return result('S3', 'Adhesion limit — exact piecewise solution', [
      info('a = μ·m_driven·g / M', a,  'm/s²'),
      info('v_c = P/(μ·m_driven·g)', vc, 'm/s'),
      info('t_c', tc, 's'),
      info('s_c', sc, 'm'),
      info('offset  t_c/2  (exact)', tc / 2, 's'),
      row('v(' + o.t + ')', s.v,      vP, 'm/s'),
      row('s(' + o.t + ')', s.x - x0, sP, 'm'),
      info('naive sqrt(2Pt/M)', vN, 'm/s'),
      info('naive, error vs exact', vN / vP - 1, ''),
      info('naive (2/3)sqrt(2P/M)t^1.5', sN, 'm'),
      info('naive, error vs exact', sN / sP - 1, ''),
    ], [
      'Shipped model, mu = ' + p.mu + ', from rest. Constant force while',
      'adhesion binds, then constant power. The post-crossover solution is',
      'v = sqrt(2P(t − t_c/2)/M): the offset is EXACTLY t_c/2, because a',
      'constant force from rest delivers precisely half the energy constant',
      'power would over the same interval — ½Mv_c² = ½(F_a v_c)t_c = ½P t_c.',
      'The naive rows are the brief’s formulas applied where they do not',
      'hold, shown so the discrepancy is on the record rather than buried.',
      'The deviation decays only as t_c/2t, so it is still 0.46 % at t = 600 s.',
    ]);
  }

  // ========================= DETERMINISM ================================
  function checkDet() {
    const keys = ['m_released', 'm_cars', 'm_ground', 'W_traction', 'W_regen',
                  'E_diss', 'dKE', 'J_acc'];
    LTT.reset(); const A = LTT.runScript(sequence(LTT.effective()));
    LTT.reset(); const B = LTT.runScript(sequence(LTT.effective()));
    const rows = keys.map(k => row('  ' + k, B[k], A[k], '', 0));
    return result('D', 'Determinism — identical inputs, identical ledger', rows, [
      'Tolerance here is exactly zero: the two runs must agree bit for bit.',
      'The integrator is a pure function of (state, control values, h), and no',
      'Math.random is reachable from the physics. Substep sizing depends only',
      'on state and h, never on wall-clock time.',
    ]);
  }

  const TESTS = { '1': test1, '2': test2, '3': test3, '4': test4,
                  'S3': checkS3, 'D': checkDet };

  function run(n, opts) {
    const f = TESTS[String(n)];
    if (!f) throw new Error('no such test: ' + n + ' (have 1,2,3,4,S3,D)');
    return f(opts);
  }
  function runAll(opts) {
    return ['1', '2', '3', '4', 'S3', 'D'].map(n => run(n, opts));
  }

  return { run, runAll, sequence, ids: ['1', '2', '3', '4', 'S3', 'D'] };
})();

// ===========================================================================
//  LTT — the console API of SPEC.md §7.5. Grows task by task.
// ===========================================================================
// One bipolar control. `throttle` is signed: +1 full forward tractive effort,
// -1 full reverse. There is no brake and no reverser — pushing the throttle
// negative while rolling forward IS the brake, regeneratively.
const CTL_NEUTRAL = { throttle: 0, chute: false };

let _st = physics.create();
let _ctl = Object.assign({}, CTL_NEUTRAL);

const LTT = {
  params:  () => PARAMS,          // the shipped defaults
  effective: () => _st.par,       // defaults WITH any overrides applied — this
                                  //   is what the physics is actually using, and
                                  //   what a test must evaluate its closed forms
                                  //   from. Using params() here silently ignored
                                  //   every override.
  derived: () => DERIVED,
  geom:    geometry,

  reset(over) {
    _st = physics.create(over);
    _ctl = Object.assign({}, CTL_NEUTRAL);
    _st.L = ledger.create(_st, 0);
    return LTT;
  },

  // Re-arm the ledger at the CURRENT state, so a test can position the train
  // and pre-load cars first and still measure only what it meant to measure.
  arm() {
    physics.resync(_st);
    const v = physics.speed(_st);
    _st.L = ledger.create(_st, 0.5 * physics.mass(_st) * v * v);
    return LTT;
  },

  ledger() {
    const v = physics.speed(_st);
    return ledger.report(_st.L, _st, 0.5 * physics.mass(_st) * v * v);
  },

  // Run a list of segments, each {t, ...controls}. Controls persist between
  // segments; x / v / fill may be set at a segment boundary. This is how the
  // scripted sequences of SPEC §7.1 and §7.2 are driven.
  runScript(segs) {
    let first = true;
    for (const g of segs) {
      LTT.setState(g);
      // Arm once the opening conditions are in place, so KE_0 is the kinetic
      // energy the run actually starts with.
      if (first) { LTT.arm(); first = false; }
      physics.advance(_st, _ctl, g.t || 0);
    }
    return LTT.ledger();
  },

  // Set controls and/or kinematic state directly. Tests use this instead of
  // the input layer, so they are exactly reproducible (SPEC §4.2).
  setState(s) {
    s = s || {};
    for (const k of ['throttle', 'chute']) {
      if (k in s) _ctl[k] = s[k];
    }
    if ('x' in s) _st.x = s.x;
    if ('fill' in s) {
      for (let i = 0; i < _st.fill.length; i++) _st.fill[i] = s.fill[i] || 0;
      physics.resync(_st);
    }
    if ('v' in s) _st.p = s.v * physics.mass(_st);   // after fill, so M is right
    if ('p' in s) _st.p = s.p;
    return LTT;
  },

  step(dt_sim) { physics.advance(_st, _ctl, dt_sim); return LTT; },

  state() {
    return {
      t: _st.t, x: _st.x, p: _st.p,
      v: physics.speed(_st), M: physics.mass(_st),
      grain_aboard: physics.grainAboard(_st),
      m_grain: _st.m_grain,
      fill: Array.from(_st.fill),
      n_base: _st.n_base, n_sub: _st.n_sub, max_sub_per_base: _st.max_sub_per_base,
    };
  },

  // Live references for the game loop. The game drives controls by mutating
  // ctlRef() in place, which is the same object the integrator reads, so there
  // is exactly one control state and no copy to fall out of step.
  stateRef: () => _st,
  ctlRef:   () => _ctl,
  speed:    () => physics.speed(_st),
  mass:     () => physics.mass(_st),

  runTest(n, opts) { return tests.run(n, opts); },
  runAll(opts)      { return tests.runAll(opts); },
  tests,

  // One shot: fresh state, set controls, advance t seconds, report.
  run(o) {
    o = o || {};
    const over = {};
    for (const k of Object.keys(PARAMS)) if (k in o) over[k] = o[k];
    LTT.reset(over);
    LTT.setState(o);
    if ('M' in o) {
      // Convenience for the hand-checkable tests: pin the total mass by
      // putting the balance of it into car 1 as pre-loaded grain.
      const bare = _st.par.m_loco + _st.par.N_cars * _st.par.m_tare;
      const extra = o.M - bare;
      if (extra < 0) throw new Error('M below bare train mass ' + bare);
      _st.fill[0] = extra;
      physics.resync(_st);
      _st.L = ledger.create(_st, 0);
      if ('v' in o) _st.p = o.v * physics.mass(_st);
    }
    if ('v0' in o) _st.p = o.v0 * physics.mass(_st);
    physics.advance(_st, _ctl, o.t || 0);
    return LTT.state();
  },
};

if (typeof globalThis !== 'undefined') { globalThis.LTT = LTT; }
if (typeof module !== 'undefined' && module.exports) { module.exports = LTT; }
</script>

<script id="ltt-app">
// ===========================================================================
//  Rendering, input and UI. Phase C onward of PLAN.md.
//  For now: the self-test panel of SPEC.md §7.5.
// ===========================================================================
(() => {
  const app = document.getElementById('app');

  // --- number formatting ---------------------------------------------------
  // Enough digits to check against a hand calculation, not so many that the
  // table stops being readable.
  function fmt(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return '';
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 1e7 || a < 1e-4) return v.toExponential(6);
    return v.toPrecision(10);
  }
  function fmtErr(v) { return v === null ? '' : v.toExponential(2); }

  // --- render one test result ---------------------------------------------
  function renderResult(r) {
    const sec = document.createElement('section');
    sec.className = 'tcard ' + (r.pass ? 'ok' : 'bad');

    const h = document.createElement('h2');
    h.innerHTML = '<span class="tid">' + r.id + '</span>' +
      '<span class="ttitle"></span>' +
      '<span class="verdict">' + (r.pass ? 'PASS' : 'FAIL') + '</span>';
    h.querySelector('.ttitle').textContent = r.title;
    sec.appendChild(h);

    const wrap = document.createElement('div');
    wrap.className = 'tscroll';
    const tb = document.createElement('table');
    tb.innerHTML = '<thead><tr><th>quantity</th><th>computed</th>' +
      '<th>closed form</th><th>rel err</th><th></th></tr></thead>';
    const body = document.createElement('tbody');
    for (const q of r.rows) {
      const tr = document.createElement('tr');
      if (Number.isNaN(q.got)) {
        tr.className = 'grp';
        const td = document.createElement('td');
        td.colSpan = 5; td.textContent = q.label;
        tr.appendChild(td);
      } else {
        const cells = [
          [q.label + (q.unit ? '  (' + q.unit + ')' : ''), 'lab'],
          [fmt(q.got), 'num'],
          [q.pred === null ? '—' : fmt(q.pred), 'num'],
          [fmtErr(q.relerr), 'num err'],
          [q.pred === null ? '' : (q.pass ? '✓' : '✗'),
           'mark ' + (q.pred === null ? '' : (q.pass ? 'ok' : 'bad'))],
        ];
        for (const [text, cls] of cells) {
          const td = document.createElement('td');
          td.className = cls; td.textContent = text;
          tr.appendChild(td);
        }
      }
      body.appendChild(tr);
    }
    tb.appendChild(body);
    wrap.appendChild(tb);
    sec.appendChild(wrap);

    if (r.notes && r.notes.length) {
      const n = document.createElement('p');
      n.className = 'notes';
      n.textContent = r.notes.join(' ').replace(/\s+/g, ' ').trim();
      sec.appendChild(n);
    }
    const tol = document.createElement('p');
    tol.className = 'tol';
    tol.textContent = 'tolerance ' + (r.id === 'D' ? '0 (bit-identical)'
                                                   : r.tol + '  (0.1 %, as the brief requires)');
    sec.appendChild(tol);
    return sec;
  }

  // Console mirror, so the same numbers are available without the UI.
  function logResult(r) {
    console.log('%c TEST ' + r.id + '  ' + r.title + '  ' + (r.pass ? 'PASS' : 'FAIL'),
      'font-weight:bold;color:' + (r.pass ? '#2e7d32' : '#c62828'));
    const t = {};
    for (const q of r.rows) {
      if (Number.isNaN(q.got)) continue;
      t[q.label] = { computed: q.got, closed_form: q.pred,
                     rel_err: q.relerr, verdict: q.pred === null ? '' : (q.pass ? 'ok' : 'FAIL') };
    }
    (console.table || console.log)(t);
    if (r.notes && r.notes.length) console.log(r.notes.join('\n'));
  }

  // --- the panel -----------------------------------------------------------
  function showPanel(which) {
    app.innerHTML = '';
    const root = document.createElement('div');
    root.className = 'panel';

    const head = document.createElement('header');
    head.innerHTML =
      '<h1>Load the train — self tests</h1>' +
      '<p>The four acceptance tests of the brief, plus supplementary check S3 ' +
      '(the adhesion limit, which Test 3 at μ → ∞ does not exercise) and a ' +
      'determinism check. Every “closed form” column is evaluated from a ' +
      'formula derived in <code>SPEC.md</code>, not from a recorded output.</p>';
    root.appendChild(head);

    const bar = document.createElement('div');
    bar.className = 'bar';
    const mk = (label, fn, cls) => {
      const b = document.createElement('button');
      b.textContent = label; b.className = cls || '';
      b.onclick = fn; bar.appendChild(b); return b;
    };
    mk('RUN ALL', () => showPanel('all'), 'primary');
    for (const id of LTT.tests.ids) mk('Test ' + id, () => showPanel(id));
    root.appendChild(bar);

    const out = document.createElement('div');
    out.className = 'out';
    root.appendChild(out);

    const foot = document.createElement('p');
    foot.className = 'foot';
    foot.innerHTML = 'Console API — substitute your own figures and compare ' +
      'against your own arithmetic:<br>' +
      '<code>LTT.runTest(3, {P: 2e6, M: 5e5, t: 30})</code> &nbsp; ' +
      '<code>LTT.runTest(3, {mu: Infinity})</code><br>' +
      '<code>LTT.setState({throttle, chute, v, x, fill})</code> &nbsp; ' +
      '<code>LTT.step(dt_sim)</code> &nbsp; <code>LTT.arm()</code><br>' +
      '<code>LTT.ledger()</code> &nbsp; <code>LTT.state()</code> &nbsp; ' +
      '<code>LTT.params()</code> &nbsp; <code>LTT.derived()</code> &nbsp; ' +
      '<code>LTT.reset(overrides)</code><br>' +
      '<code>opts</code> may override any PARAM, which is exactly how Test 3 ' +
      'is invoked with <code>mu: Infinity</code>.';
    root.appendChild(foot);
    app.appendChild(root);

    const busy = document.createElement('div');
    busy.className = 'banner';
    busy.textContent = 'running…';
    out.appendChild(busy);

    // Deferred by a timer, not by requestAnimationFrame, so the button press
    // still feels immediate on a phone but the panel also works where rAF
    // never fires — headless Chrome with --dump-dom, for one, which is how
    // this panel is checked during the build.
    setTimeout(() => {
      out.innerHTML = '';
      // No try/catch that could hide a failure: a throw must surface.
      const results = (which === 'all') ? LTT.runAll() : [LTT.runTest(which)];
      const allPass = results.every(r => r.pass);
      const banner = document.createElement('div');
      banner.className = 'banner ' + (allPass ? 'ok' : 'bad');
      banner.textContent = (which === 'all' ? 'RUN ALL — ' : 'TEST ' + which + ' — ') +
        (allPass ? 'ALL PASS' : 'FAILURE');
      out.appendChild(banner);
      for (const r of results) { out.appendChild(renderResult(r)); logResult(r); }
      console.log('%c' + banner.textContent, 'font-size:14px;font-weight:bold');
    }, 0);
  }

  // =========================================================================
  //  GAME
  // =========================================================================
  const P = LTT.params(), DER = LTT.derived();
  const G = LTT.geom;
  const GAP = P.L_pitch - P.L_body;

  // --- persistence (SPEC §5.5) --------------------------------------------
  // Best passing time and the intro-seen flag only. Every access is wrapped:
  // a private window with site data blocked must still play normally.
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ltt.' + k);
                      return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('ltt.' + k, JSON.stringify(v)); }
                catch (e) { /* storage unavailable; the game does not depend on it */ } },
    del(k)    { try { localStorage.removeItem('ltt.' + k); } catch (e) {} },
  };

  // --- run state -----------------------------------------------------------
  const S = {
    mode: 'title',        // title | intro | run | paused | report
    practice: false,
    started: false,       // clock starts on the first real input
    tWall: 0,
    slider: 0,            // -1 full reverse .. 0 coast .. +1 full forward
    chute: false,
    tripped: false,
    drawer: false,
    introPage: 0,
    verdict: null,
  };
  let st = null, ctl = null;

  function newRun(practice) {
    LTT.reset();
    LTT.setState({ throttle: 0, chute: false });
    LTT.arm();
    st = LTT.stateRef();
    ctl = LTT.ctlRef();
    S.practice = !!practice;
    S.started = false; S.tWall = 0; S.slider = 0;
    S.chute = false; S.tripped = false; S.verdict = null;
    S.drawer = !!practice;
    camX = st.x + 12;
    spark.length = 0;
    S.mode = 'run';
  }

  // --- seeded PRNG for cosmetic particles ---------------------------------
  // Kept in its own stream. The physics never reads it, so particle activity
  // cannot perturb a trajectory (SPEC §4.2).
  let seed = 0x2F6E2B1 >>> 0;
  function rnd() {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17;
    seed ^= seed << 5;  seed >>>= 0;
    return seed / 4294967296;
  }

  // --- canvas --------------------------------------------------------------
  let cv, ctx, W = 0, H = 0, dpr = 1, camX = 0;
  let mapc = null, mapx = null, MW = 0, MH = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const r = cv.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (mapc) {
      const q = mapc.getBoundingClientRect();
      MW = Math.max(1, Math.round(q.width)); MH = Math.max(1, Math.round(q.height));
      mapc.width = Math.round(MW * dpr); mapc.height = Math.round(MH * dpr);
      mapx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

  // Camera: look ahead of the nose while approaching, then lock to the chute,
  // because once the train is in range that is where everything happens.
  function camTarget() {
    return st.x < P.x_chute - 12 ? st.x + 12 : P.x_chute;
  }

  // --- cosmetic grain particles (fixed pool) -------------------------------
  const spark = [];
  const SPARK_MAX = 400;

  function updateSparks(dtWall, scale) {
    // Landing is instantaneous in the physics; this is decoration only.
    const spoutY = -P.h_chute;             // metres above the car rim datum
    if (S.chute && (S.mode === 'run')) {
      const want = 16;
      for (let i = 0; i < want && spark.length < SPARK_MAX; i++) {
        spark.push({
          x: P.x_chute + (rnd() - 0.5) * P.w_chute,
          y: spoutY, vy: 5 + rnd() * 3, r: 0.16 + rnd() * 0.12,
        });
      }
    }
    const dt = dtWall * P.C_time;
    for (let i = spark.length - 1; i >= 0; i--) {
      const s = spark[i];
      s.vy += P.g * dt * 0.25;
      s.y += s.vy * dt;
      if (s.y > 1.2) spark.splice(i, 1);
    }
  }

  // ------------------------------------------------------------------ draw
  function draw(dtWall) {
    const scale = clamp(W / 26, 12, 34);
    const railY = Math.round(H * 0.74);
    // Smooth for ordinary motion, but snap when the target is far away — at the
    // start of a run, or after the train is repositioned. Lerping across a
    // kilometre would leave the player watching empty track for a second.
    const ct = camTarget();
    camX = Math.abs(ct - camX) > 150 ? ct
                                     : camX + (ct - camX) * (1 - Math.exp(-dtWall * 7));
    const sx = x => (x - camX) * scale + W * 0.55;
    const m = v => v * scale;                       // metres -> pixels

    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, railY);
    sky.addColorStop(0, '#7FC4CE'); sky.addColorStop(1, '#BFE3E8');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, railY);

    drawBackdrop(sx, m, railY, scale);
    drawGround(sx, m, railY, scale);
    drawSpill(sx, m, railY, scale);
    drawTrain(sx, m, railY, scale);
    drawChute(sx, m, railY, scale);
    drawSparks(sx, m, railY, scale);
  }

  const OUT = '#3B2A1F';
  function stroke(w) { ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                       ctx.strokeStyle = OUT; ctx.lineWidth = w; ctx.stroke(); }
  function rrect(x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);         ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackdrop(sx, m, railY, scale) {
    // grain elevator behind the chute — gives the scene a place to be
    const bx = sx(P.x_chute) - m(38), bw = m(11), bh = m(15);
    ctx.fillStyle = '#8E7B6A';
    ctx.fillRect(bx, railY - bh, bw, bh); stroke(2);
    ctx.beginPath(); ctx.rect(bx, railY - bh, bw, bh); stroke(2.5);
    ctx.fillStyle = '#A89684';
    for (let i = 0; i < 3; i++) {
      const cx = bx + bw * (0.18 + i * 0.32);
      ctx.beginPath(); ctx.arc(cx, railY - bh, m(1.7), Math.PI, 0); ctx.fill(); stroke(2);
    }
    // low hills
    ctx.fillStyle = '#9CCBB0';
    ctx.beginPath(); ctx.moveTo(0, railY);
    for (let i = 0; i <= 8; i++) {
      const x = (W / 8) * i;
      ctx.lineTo(x, railY - m(3) - Math.sin(i * 1.7 + 0.6) * m(1.8));
    }
    ctx.lineTo(W, railY); ctx.closePath(); ctx.fill();
  }

  function drawGround(sx, m, railY, scale) {
    ctx.fillStyle = '#8A6F52'; ctx.fillRect(0, railY, W, H - railY);
    ctx.fillStyle = '#7A6146'; ctx.fillRect(0, railY, W, m(0.35));
    // sleepers, spaced in world units so they slide with the train
    ctx.fillStyle = '#6B5238';
    const sp = 0.7, x0 = Math.floor((camX - 30) / sp) * sp;
    for (let x = x0; x < camX + 40; x += sp) {
      ctx.fillRect(sx(x), railY + m(0.10), Math.max(2, m(0.28)), m(0.5));
    }
    // rail
    ctx.fillStyle = '#5A4233'; ctx.fillRect(0, railY - m(0.12), W, Math.max(2, m(0.16)));
    // track limits
    for (const lim of [P.x_min, P.x_max]) {
      const px = sx(lim);
      if (px > -40 && px < W + 40) {
        ctx.fillStyle = '#C4483A';
        ctx.fillRect(px - 3, railY - m(2.2), 6, m(2.2));
        ctx.beginPath(); ctx.rect(px - 3, railY - m(2.2), 6, m(2.2)); stroke(2);
      }
    }
  }

  function drawSpill(sx, m, railY, scale) {
    // mounds from the heightfield, so the player can see where it went
    const bin = st.spill_bin;
    for (let i = 0; i < st.spill.length; i++) {
      const kg = st.spill[i]; if (kg < 20) continue;
      const wx = P.x_min + i * bin;
      const px = sx(wx); if (px < -60 || px > W + 60) continue;
      // a 2 m bin of wheat, spread to a shallow heap
      const hgt = Math.min(2.2, Math.cbrt(kg / P.rho_grain) * 0.45);
      const wid = Math.max(bin, hgt * 3.2);
      ctx.fillStyle = '#D9A63F';
      ctx.beginPath();
      ctx.moveTo(px - m(wid / 2), railY + m(0.3));
      ctx.quadraticCurveTo(px, railY - m(hgt), px + m(wid / 2), railY + m(0.3));
      ctx.closePath(); ctx.fill(); stroke(2);
    }
  }

  function wheels(cx0, cx1, railY, m) {
    const r = m(0.52);
    for (const cx of [cx0, cx1]) {
      ctx.fillStyle = '#4A362A';
      ctx.beginPath(); ctx.arc(cx, railY - r, r, 0, 6.2832); ctx.fill(); stroke(2);
      ctx.fillStyle = '#6B5238';
      ctx.beginPath(); ctx.arc(cx, railY - r, r * 0.42, 0, 6.2832); ctx.fill(); stroke(1.5);
    }
  }

  function drawTrain(sx, m, railY, scale) {
    const floor = railY - m(1.15);
    // cars, only those on screen
    const under = G.underChute(P, st.x);
    for (let k = 0; k < P.N_cars; k++) {
      const F = G.troughFront(P, st.x, k), R = F - P.L_body;
      if (sx(F) < -80 || sx(R) > W + 80) continue;
      const x0 = sx(R), x1 = sx(F), bw = x1 - x0;
      const bh = m(P.car_d), top = floor - bh;

      wheels(x0 + bw * 0.18, x1 - bw * 0.18, railY, m);

      // body shell
      ctx.fillStyle = '#C9A66B';
      rrect(x0, top, bw, bh + m(0.25), m(0.28)); ctx.fill(); stroke(2.5);
      // interior well
      ctx.fillStyle = '#6E5A44';
      rrect(x0 + m(0.28), top + m(0.22), bw - m(0.56), bh - m(0.22), m(0.18));
      ctx.fill();
      // grain
      const frac = clamp(st.fill[k] / P.m_cap, 0, 1);
      if (frac > 0.001) {
        const gh = (bh - m(0.22)) * frac;
        ctx.save(); ctx.clip();
        ctx.fillStyle = frac >= P.fill_target ? '#F0C558' : '#E8B54A';
        ctx.fillRect(x0 + m(0.28), top + m(0.22) + (bh - m(0.22) - gh),
                     bw - m(0.56), gh + m(0.3));
        ctx.restore();
      }
      // fill_target line on the car itself
      const ty = top + m(0.22) + (bh - m(0.22)) * (1 - P.fill_target);
      ctx.strokeStyle = '#F6EFE3'; ctx.lineWidth = 1.6;
      ctx.setLineDash([m(0.35), m(0.28)]);
      ctx.beginPath(); ctx.moveTo(x0 + m(0.3), ty); ctx.lineTo(x1 - m(0.3), ty);
      ctx.stroke(); ctx.setLineDash([]);
      // outline over the top
      rrect(x0, top, bw, bh + m(0.25), m(0.28)); stroke(2.5);
      // number
      if (bw > 26) {
        ctx.fillStyle = '#3B2A1F'; ctx.font = '700 ' + Math.min(15, m(1.1)) + 'px system-ui';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(k + 1), (x0 + x1) / 2, floor + m(0.02));
      }
      if (under.kind === 'car' && under.index === k) {
        ctx.strokeStyle = '#F6EFE3'; ctx.lineWidth = 2.5;
        rrect(x0 - 3, top - 3, bw + 6, bh + m(0.25) + 6, m(0.32)); ctx.stroke();
      }
      // coupling to the next car
      const nx = sx(R - GAP);
      ctx.fillStyle = '#4A362A';
      ctx.fillRect(nx, floor - m(0.25), x0 - nx, Math.max(2, m(0.22)));
    }

    // locomotive
    const lx1 = sx(st.x), lx0 = sx(st.x - P.L_loco);
    if (lx1 > -120 && lx0 < W + 120) {
      const bw = lx1 - lx0, bh = m(3.1), top = floor - bh;
      wheels(lx0 + bw * 0.16, lx1 - bw * 0.16, railY, m);
      wheels(lx0 + bw * 0.40, lx0 + bw * 0.62, railY, m);
      // hood
      ctx.fillStyle = '#C4483A';
      rrect(lx0, top + m(0.9), bw, bh - m(0.9) + m(0.25), m(0.3)); ctx.fill(); stroke(2.5);
      // cab
      const cw = bw * 0.36;
      ctx.fillStyle = '#A93A2E';
      rrect(lx0 + m(0.3), top, cw, bh * 0.62, m(0.28)); ctx.fill(); stroke(2.5);
      // windows
      ctx.fillStyle = '#BFE3E8';
      rrect(lx0 + m(0.75), top + m(0.35), cw - m(0.95), bh * 0.3, m(0.18));
      ctx.fill(); stroke(1.8);
      // chimney
      ctx.fillStyle = '#4A362A';
      rrect(lx1 - bw * 0.3, top + m(0.35), m(0.9), m(0.75), m(0.12));
      ctx.fill(); stroke(2);
      // stripe
      ctx.fillStyle = '#E8B54A';
      ctx.fillRect(lx0 + m(0.3), floor - m(0.75), bw - m(0.6), Math.max(2, m(0.3)));
      if (under.kind === 'loco') {
        ctx.strokeStyle = '#FF8A7A'; ctx.lineWidth = 3;
        rrect(lx0 - 3, top - 3, bw + 6, bh + m(0.25) + 6, m(0.34)); ctx.stroke();
      }
    }
  }

  function drawChute(sx, m, railY, scale) {
    const cx = sx(P.x_chute);
    const rim = railY - m(1.15 + P.car_d);        // car rim datum
    const spout = rim - m(P.h_chute);
    // tower
    ctx.fillStyle = '#A89684';
    ctx.fillRect(cx - m(1.35), 0, m(2.7), spout - m(1.6));
    ctx.beginPath(); ctx.rect(cx - m(1.35), -4, m(2.7), spout - m(1.6) + 4); stroke(2.5);
    // hopper
    ctx.fillStyle = '#8E7B6A';
    ctx.beginPath();
    ctx.moveTo(cx - m(1.35), spout - m(1.6));
    ctx.lineTo(cx + m(1.35), spout - m(1.6));
    ctx.lineTo(cx + m(P.w_chute / 2), spout);
    ctx.lineTo(cx - m(P.w_chute / 2), spout);
    ctx.closePath(); ctx.fill(); stroke(2.5);
    // gate
    ctx.fillStyle = S.chute ? '#6FCB80' : '#C4483A';
    ctx.fillRect(cx - m(P.w_chute / 2) - 2, spout - 3, m(P.w_chute) + 4, 6);
    ctx.beginPath(); ctx.rect(cx - m(P.w_chute / 2) - 2, spout - 3, m(P.w_chute) + 4, 6);
    stroke(2);
    // aperture guide line to the ground
    ctx.strokeStyle = '#3B2A1F30'; ctx.lineWidth = 1;
    ctx.setLineDash([4, 5]);
