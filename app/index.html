    ctx.beginPath(); ctx.moveTo(cx, spout); ctx.lineTo(cx, railY); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawSparks(sx, m, railY, scale) {
    const rim = railY - m(1.15 + P.car_d);
    ctx.fillStyle = '#E8B54A';
    for (const s of spark) {
      const py = rim + m(s.y + P.h_chute) - m(P.h_chute);
      ctx.beginPath(); ctx.arc(sx(s.x), rim + m(s.y), Math.max(1.2, m(s.r)), 0, 6.2832);
      ctx.fill();
    }
  }

  // ------------------------------------------------------------- overview map
  // The play view is 26 m wide; the train is 361 m long and the yard is longer
  // still. This is the "where am I" view: whole train, whole yard, every car
  // shaded by how full it is, and a bracket showing what the play view covers.
  function drawMap() {
    if (!mapx) return;
    // The train trails 361 m behind the nose, so at the start its rear is at
    // x_start - 361. Cover that through to the nose position that puts car 20
    // under the chute, with a little air at each end.
    const X0 = P.x_start - DER.train_len - 15;
    const X1 = P.L_loco + (P.L_pitch - P.L_body) + (P.N_cars - 1) * P.L_pitch + 30;
    const mx = x => (x - X0) / (X1 - X0) * MW;
    mapx.clearRect(0, 0, MW, MH);
    const midY = Math.round(MH * 0.58);

    // yard: rail line, with the ends of the usable track marked
    mapx.strokeStyle = '#4A362A'; mapx.lineWidth = 2;
    mapx.beginPath(); mapx.moveTo(mx(P.x_min), midY); mapx.lineTo(mx(P.x_max), midY);
    mapx.stroke();
    mapx.fillStyle = '#6B5238';
    for (const lim of [P.x_min, P.x_max]) mapx.fillRect(mx(lim) - 1, midY - 5, 2, 10);

    // the train: one segment per car, shaded by fill, plus the loco
    const h = 11, top = midY - h / 2;
    const under = G.underChute(P, st.x);
    for (let k = 0; k < P.N_cars; k++) {
      const F = G.troughFront(P, st.x, k), R = F - P.L_body;
      const x0 = mx(R), w = Math.max(1.5, mx(F) - x0);
      const f = clamp(st.fill[k] / P.m_cap, 0, 1);
      mapx.fillStyle = '#4A362A';
      mapx.fillRect(x0, top, w, h);
      if (f > 0) {
        mapx.fillStyle = f >= P.fill_target ? '#6FCB80' : '#E8B54A';
        mapx.fillRect(x0, top + h * (1 - f), w, h * f);
      }
      if (under.kind === 'car' && under.index === k) {
        mapx.strokeStyle = '#F6EFE3'; mapx.lineWidth = 1.5;
        mapx.strokeRect(x0 - 0.75, top - 1.5, w + 1.5, h + 3);
      }
    }
    const lx0 = mx(st.x - P.L_loco), lw = Math.max(2, mx(st.x) - lx0);
    mapx.fillStyle = '#C4483A'; mapx.fillRect(lx0, top - 1, lw, h + 2);

    // the chute, and what the play view is showing
    const cxp = mx(P.x_chute);
    mapx.fillStyle = '#F6EFE3';
    mapx.fillRect(cxp - 1, 1, 2, MH - 2);
    mapx.beginPath(); mapx.moveTo(cxp - 4, 1); mapx.lineTo(cxp + 4, 1);
    mapx.lineTo(cxp, 7); mapx.closePath(); mapx.fill();

    const scale = clamp(W / 26, 12, 34);
    const halfView = (W / scale) / 2;
    mapx.strokeStyle = '#F6EFE399'; mapx.lineWidth = 1;
    mapx.strokeRect(mx(camX - halfView), 1.5, mx(camX + halfView) - mx(camX - halfView), MH - 3);

    // distance from the chute to the nearest car edge, in plain metres
    mapx.fillStyle = '#7A6249';
    mapx.font = '9px ui-monospace, Menlo, Consolas, monospace';
    mapx.textAlign = 'right'; mapx.textBaseline = 'top';
    mapx.fillText(Math.round(st.x) + ' m', MW - 4, 1);
  }

  const mmss = t => { t = Math.max(0, t || 0);
    return Math.floor(t / 60) + ':' + (t % 60 < 10 ? '0' : '') + (t % 60).toFixed(1); };
  const mmssS = t => { t = Math.max(0, t || 0);
    return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };

  function updateHUD() {
    const v = LTT.speed(), M = LTT.mass(), L = LTT.ledger();
    el.hv.textContent = v.toFixed(2);
    el.ht.textContent = mmss(S.tWall);
    el.hts.textContent = 'sim ' + mmssS(st.t);
    el.hm.textContent = (M / 1000).toFixed(1);
    el.hthr.textContent = Math.round(Math.abs(S.slider) * 100);
    el.hthrl.textContent = S.slider > 0 ? '% fwd'
      : (S.slider < 0 ? (v > 0.02 ? '% regen' : '% rev') : 'coast');

    const lossFrac = L.m_released > 0 ? L.m_ground / L.m_released : 0;
    el.blos.style.width = clamp(lossFrac / P.loss_budget, 0, 1) * 100 + '%';
    el.mloss.classList.toggle('over', lossFrac >= P.loss_budget);
    el.vlos.textContent = (100 * lossFrac).toFixed(3) + ' % / 1 %';

    // The accretion retarding force, live. v*dM/dt with dM/dt the CAPTURED
    // flow — grain that misses is never accelerated, so it exerts nothing.
    const capturing = S.chute ? G.captureFraction(P, st.x) : 0;
    const drag = Math.abs(v) * P.mdot * capturing;
    el.bacc.style.width = clamp(drag / 3000, 0, 1) * 100 + '%';
    el.vacc.textContent = drag < 1 ? '0 kN' : (drag / 1000).toFixed(2) + ' kN';

    // Sit the caption under the HUD by measurement, not by a guessed constant:
    // the HUD wraps to two lines at phone width and to one on a wide screen.
    const hudH = el.hud.offsetHeight;
    el.cap.style.top = (hudH + 3) + 'px';
    el.warn.style.top = (hudH + 31) + 'px';

    const u = G.underChute(P, st.x);
    el.cap.textContent =
      u.kind === 'car'  ? 'CAR ' + (u.index + 1) + '  ·  ' +
                          (100 * st.fill[u.index] / P.m_cap).toFixed(1) + ' %'
    : u.kind === 'gap'  ? (u.index + 1 >= P.N_cars ? 'BEHIND CAR ' + P.N_cars
                                                   : 'GAP ' + (u.index + 1) + '–' + (u.index + 2))
    : u.kind === 'loco' ? 'LOCOMOTIVE — grain is being wasted'
    : u.kind === 'ahead' ? 'CHUTE AHEAD OF THE TRAIN'
    : 'PAST THE LAST CAR';

    el.warn.hidden = !S.tripped;
    el.bchute.classList.toggle('on', S.chute);

    for (let i = 0; i < P.N_cars; i++) {
      const f = clamp(st.fill[i] / P.m_cap, 0, 1);
      const c = el.cells[i];
      const land = window.matchMedia('(orientation: landscape)').matches;
      if (land) { c.lvl.style.width = f * 100 + '%'; c.lvl.style.height = '';
                  c.thr.style.left = P.fill_target * 100 + '%'; c.thr.style.top = ''; }
      else      { c.lvl.style.height = f * 100 + '%'; c.lvl.style.width = '';
                  c.thr.style.bottom = P.fill_target * 100 + '%'; c.thr.style.left = ''; }
      c.c.classList.toggle('done', f >= P.fill_target);
      c.c.classList.toggle('here', u.kind === 'car' && u.index === i);
    }

    if (S.drawer) {
      el.drawer.hidden = false;
      const row = (a, b) => '<tr><td>' + a + '</td><td>' + b + '</td></tr>';
      const MJ = j => (j / 1e6).toFixed(3) + ' MJ';
      const t = x => (x / 1000).toFixed(2) + ' t';
      el.drawer.innerHTML = '<h3>ledger — live</h3><table>' +
        row('released', t(L.m_released)) + row('in cars', t(L.m_cars)) +
        row('on the ground', t(L.m_ground)) +
        '<tr class="sep"><td>Test 1 closure</td><td>' +
          L.mass_closure.toExponential(2) + '</td></tr>' +
        row('W_traction', MJ(L.W_traction)) + row('W_regen', MJ(L.W_regen)) +
        row('ΔKE_total', MJ(L.dKE)) + row('E_diss = ½∫v²dM', MJ(L.E_diss)) +
        '<tr class="sep"><td>Test 2 closure</td><td>' +
          L.energy_closure.toExponential(2) + '</td></tr>' +
        '</table>';
    } else el.drawer.hidden = true;
  }

  // ---------------------------------------------------------------- input
  function setSlider(v) {
    v = clamp(v, -1, 1);
    // Neutral detent. Coasting is a real tactic — the train never slows on its
    // own — so hitting exactly zero has to be reliable rather than lucky.
    if (Math.abs(v) < 0.025) v = 0;
    S.slider = v;
    const h = el.sl.clientHeight, k = 42;
    el.knob.style.top = ((0.5 - S.slider * 0.5) * (h - k) + k / 2) + 'px';
    el.knob.textContent = S.slider === 0 ? '0'
      : (S.slider > 0 ? '+' : '−') + Math.round(Math.abs(S.slider) * 100);
    if (S.slider !== 0) S.started = true;
  }
  function wireInput() {
    // Sticky slider: it holds where released, like a locomotive controller.
    let drag = false;
    const fromEvent = e => {
      const r = el.sl.getBoundingClientRect();
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
      const k = 42;
      return clamp((0.5 - (y - k / 2) / (r.height - k)) * 2, -1, 1);
    };
    const down = e => { drag = true; setSlider(fromEvent(e)); e.preventDefault(); };
    const move = e => { if (drag) { setSlider(fromEvent(e)); e.preventDefault(); } };
    const up = () => { drag = false; };
    el.sl.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);

    el.bchute.onclick = () => { S.chute = !S.chute; S.started = true; };
    el.bdone.onclick = () => finish();
    el.bpause.onclick = () => togglePause();
    el.bledg.onclick = () => { S.drawer = !S.drawer; };

    window.addEventListener('keydown', e => {
      if (S.mode !== 'run' && S.mode !== 'paused') return;
      const k = e.key;
      // + / - are the fine control, arrows the coarse one.
      if (k === '+' || k === '=') { setSlider(S.slider + 0.02); e.preventDefault(); }
      else if (k === '-' || k === '_') { setSlider(S.slider - 0.02); e.preventDefault(); }
      else if (k === 'ArrowUp')   { setSlider(S.slider + 0.10); e.preventDefault(); }
      else if (k === 'ArrowDown') { setSlider(S.slider - 0.10); e.preventDefault(); }
      else if (k === '0')    setSlider(0);
      else if (k === 'Home') setSlider(1);
      else if (k === 'End')  setSlider(-1);
      else if (k === ' ')    { S.chute = !S.chute; S.started = true; e.preventDefault(); }
      else if (k === 'p' || k === 'P') togglePause();
      else if (k === 'd' || k === 'D') finish();
    });
    window.addEventListener('resize', () => { resize(); setSlider(S.slider); });
  }

  function togglePause() {
    if (S.mode === 'run') S.mode = 'paused';
    else if (S.mode === 'paused') S.mode = 'run';
    renderOverlay();
  }

  // ----------------------------------------------------------------- loop
  let last = 0;
  function frame(now) {
    // Clamped at both ends. The upper clamp is the accumulator limit of
    // SPEC §4.1, so a stalled tab cannot trigger a catch-up spiral. The lower
    // clamp matters because rAF timestamps and performance.now() do not always
    // agree, and a single negative frame would run the elapsed clock backwards.
    const dtWall = Math.max(0, Math.min((now - last) / 1000, P.max_catchup_frames / 60));
    last = now;

    if (st) {
      if (S.mode === 'run') {
        // Effective controls: player input, with the trip stop able to override.
        // The trip stop is a normal brake application through the normal path,
        // so the energy it removes lands in W_regen and the ledger still closes.
        // No crash state, per SPEC decision 11.
        let thr = S.slider;
        const v = LTT.speed(), d = rules.stopDistance(P, v, LTT.mass()) + 6;
        S.tripped = false;
        if ((v > 0 && st.x + d > P.x_max) || (v < 0 && st.x - d < P.x_min)) {
          thr = v > 0 ? -1 : 1; S.tripped = true;    // full regenerative effort
        }
        ctl.throttle = thr; ctl.chute = S.chute;

        if (S.started) S.tWall += dtWall;
        LTT.step(dtWall * P.C_time);
      }
      if (cv) {
        updateSparks(S.mode === 'run' ? dtWall : 0, 1);
        draw(dtWall); drawMap(); updateHUD();
      }
    }
    schedule();
  }

  // rAF is the right driver when the page is visible, but it does not fire at
  // all in some environments (headless Chrome with --screenshot, for one, which
  // is how this game is checked during the build) and is throttled hard in
  // background tabs. Fall back to a timer if no frame has arrived, so the game
  // still advances rather than silently freezing.
  // Whichever of the two fires first wins and the other is discarded, matched
  // by a generation counter. Without that, both fire, both call frame(), each
  // schedules another pair, and the frame rate doubles every tick.
  let tick = 0;
  function schedule() {
    const mine = ++tick;
    const go = t => { if (mine !== tick) return; frame(t); };
    requestAnimationFrame(go);
    setTimeout(() => go(performance.now()), 40);
  }

  // --------------------------------------------------------------- finish
  function finish() {
    if (S.practice) { S.mode = 'title'; renderOverlay(); return; }
    S.verdict = rules.verdict(st, LTT.ledger());
    S.mode = 'report';
    if (S.verdict.pass) {
      const best = store.get('best', null);
      if (best === null || S.tWall < best) { store.set('best', S.tWall); S.newBest = true; }
      else S.newBest = false;
    }
    renderOverlay();
  }

  // -------------------------------------------------------------- overlays
  let overlay = null;
  function clearOverlay() { if (overlay) { overlay.remove(); overlay = null; } }
  function modal(build) {
    clearOverlay();
    overlay = document.createElement('div'); overlay.className = 'modal';
    const c = document.createElement('div'); c.className = 'card';
    build(c); overlay.appendChild(c);
    (document.querySelector('.stage') || app).appendChild(overlay);
  }

  function renderOverlay() {
    clearOverlay();
    if (S.mode === 'title')  return showTitle();
    if (S.mode === 'intro')  return showIntro();
    if (S.mode === 'paused') return showPaused();
    if (S.mode === 'report') return showReport();
  }

        'opposite sign: the motors become generators and give the energy back. ' +
        'Same rating, same adhesion limit, opposite direction. Hold it through ' +
        'zero and you will start moving the other way.</li>' +
        '<li><b>CHUTE</b> — opens and shuts the grain.</li>' +
        '<li><b>DONE</b> — ends the run and scores it.</li></ul>' +
        '<p class="keys"><b>+ / −</b> power in 2 % steps (fine) · ' +
        '<b>↑ ↓</b> in 10 % steps · <b>0</b> coast · ' +
        '<b>Home/End</b> full forward / full reverse<br>' +
        '<b>SPACE</b> chute · <b>P</b> pause · <b>D</b> done</p>' +
        '<p>Grain lands where the chute is. If a coupling gap — or the ' +
        'locomotive, or nothing at all — is underneath, that grain is on the ground.</p>' },
  ];

  function showIntro() {
    modal(c => {
      const pg = INTRO[S.introPage];
      c.innerHTML = '<h2>' + pg.h + '</h2>' + pg.html;
      const dots = document.createElement('div'); dots.className = 'dots';
      INTRO.forEach((_, i) => { const d = document.createElement('div');
        d.className = 'dot' + (i === S.introPage ? ' on' : ''); dots.appendChild(d); });
      c.appendChild(dots);
      const b = document.createElement('div'); b.className = 'cardbtns';
      const next = document.createElement('button'); next.className = 'primary';
      next.textContent = S.introPage < INTRO.length - 1 ? 'Next' : 'Start';
      next.onclick = () => {
        if (S.introPage < INTRO.length - 1) { S.introPage++; showIntro(); }
        else { store.set('seen', true); S.introPage = 0; S.mode = 'title'; renderOverlay(); }
      };
      const skip = document.createElement('button');
      skip.textContent = 'Skip';
      skip.onclick = () => { store.set('seen', true); S.introPage = 0;
                             S.mode = 'title'; renderOverlay(); };
      b.appendChild(next); b.appendChild(skip); c.appendChild(b);
    });
  }

  function showTitle() {
    modal(c => {
      const best = store.get('best', null);
      c.innerHTML = '<h2>Load the train</h2>' +
        '<p>Basic Skills for Experimentalists (TIGP 2026), Project 1.</p>' +
        (best !== null
          ? '<p>Your best passing run: <b>' + mmss(best) + '</b> &nbsp; grade <b>' +
            rules.grade(best) + '</b></p>'
          : '<p>No passing run recorded yet.</p>');
      const b = document.createElement('div'); b.className = 'cardbtns';
      const mk = (t, f, cls) => { const x = document.createElement('button');
        x.textContent = t; x.className = cls || ''; x.onclick = f; b.appendChild(x); };
      mk('Timed run', () => { newRun(false); clearOverlay(); }, 'primary');
      mk('Practice', () => { newRun(true); clearOverlay(); });
      mk('How it works', () => { S.introPage = 0; S.mode = 'intro'; renderOverlay(); });
      mk('Self tests', () => showPanel('all'));
      if (best !== null) mk('Reset best', () => { store.del('best'); showTitle(); });
      c.appendChild(b);
    });
  }

  function showPaused() {
    modal(c => {
      c.innerHTML = '<h2>Paused</h2><p>The clock is stopped and the controls ' +
        'are inert.</p>';
      const b = document.createElement('div'); b.className = 'cardbtns';
      const mk = (t, f, cls) => { const x = document.createElement('button');
        x.textContent = t; x.className = cls || ''; x.onclick = f; b.appendChild(x); };
      mk('Resume', () => { S.mode = 'run'; clearOverlay(); }, 'primary');
      mk('How it works', () => { S.introPage = 0; S.mode = 'intro'; renderOverlay(); });
      mk('Abandon run', () => { S.mode = 'title'; renderOverlay(); });
      c.appendChild(b);
    });
  }

  function showReport() {
    modal(c => {
      const V = S.verdict, L = LTT.ledger();
      const t = x => (x / 1000).toFixed(3) + ' t';
      const MJ = j => (j / 1e6).toFixed(3) + ' MJ';
      c.innerHTML =
        '<h2>Run complete</h2>' +
        '<p class="big ' + (V.pass ? 'pass' : 'fail') + '">' +
          (V.pass ? 'PASS' : 'FAIL') + '</p>' +
        '<table class="rpt">' +
        '<tr><td>every car ≥ 90 %</td><td class="' + (V.fillPass ? 'pass' : 'fail') + '">' +
          (V.fillPass ? 'PASS' : 'FAIL') + ' — lowest is car ' + V.minCar + ' at ' +
          (100 * V.minFrac).toFixed(1) + ' %</td></tr>' +
        '<tr><td>loss &lt; 1 % of released</td><td class="' + (V.lossPass ? 'pass' : 'fail') + '">' +
          (V.lossPass ? 'PASS' : 'FAIL') + ' — ' + (100 * V.loss).toFixed(3) + ' %</td></tr>' +
        '<tr><td>elapsed</td><td>' + mmss(S.tWall) + '  (sim ' + mmssS(st.t) + ')</td></tr>' +
        (V.pass ? '<tr><td>grade</td><td>' + rules.grade(S.tWall) + '</td></tr>' : '') +
        '</table>' +
        (V.under.length
          ? '<p class="fail">Cars under 90 %: ' + V.under.join(', ') + '</p>' : '') +
        (V.pass && S.newBest ? '<p class="pass">New personal best.</p>' : '') +
        '<h3>Mass ledger — Test 1</h3><table class="rpt">' +
        '<tr><td>released by the chute</td><td>' + t(L.m_released) + '</td></tr>' +
        '<tr><td>in cars</td><td>' + t(L.m_cars) + '</td></tr>' +
        '<tr><td>on the ground</td><td>' + t(L.m_ground) + '</td></tr>' +
        '<tr><td>closure</td><td>' + L.mass_closure.toExponential(2) + '</td></tr></table>' +
        '<h3>Energy ledger — Test 2</h3><table class="rpt">' +
        '<tr><td>W_traction</td><td>' + MJ(L.W_traction) + '</td></tr>' +
        '<tr><td>W_regen (recovered)</td><td>' + MJ(L.W_regen) + '</td></tr>' +
        '<tr><td>ΔKE_total</td><td>' + MJ(L.dKE) + '</td></tr>' +
        '<tr><td>E_diss = ½∫v²dM</td><td>' + MJ(L.E_diss) + '</td></tr>' +
        '<tr><td>closure</td><td>' + L.energy_closure.toExponential(2) + '</td></tr></table>';
      const b = document.createElement('div'); b.className = 'cardbtns';
      const mk = (tx, f, cls) => { const x = document.createElement('button');
        x.textContent = tx; x.className = cls || ''; x.onclick = f; b.appendChild(x); };
      mk('Run again', () => { newRun(false); clearOverlay(); }, 'primary');
      mk('Title', () => { S.mode = 'title'; renderOverlay(); });
      c.appendChild(b);
    });
  }

  // --- entry ---------------------------------------------------------------
  const wantTest = /(^|[?&])test(=|&|$)/.test(location.search);
  if (wantTest) {
    showPanel('all');
  } else {
    newRun(false);
    buildGame();
    S.mode = store.get('seen', false) ? 'title' : 'intro';
    renderOverlay();
    last = performance.now();
    schedule();
  }
})();
</script>
